<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>服務總覽｜小佑的日常生活</title>
<meta name="description" content="小佑的日常生活各項公開服務總覽。">
<style>
:root{--bg:#fffafa;--text:#40363a;--muted:#7c6d72;--accent:#b95878;--line:#ead5dc;--soft:#f8e9ee}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;line-height:1.8}a{color:inherit}.wrap{width:min(1120px,calc(100% - 32px));margin:auto}
header{border-bottom:1px solid var(--line);background:var(--bg)}.nav{min-height:68px;display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{font-weight:850;color:var(--accent)}.nav a{font-size:.82rem;color:var(--muted);text-decoration:none}
main{padding:68px 0 80px}.eyebrow{font-size:.72rem;color:var(--accent);font-weight:800;letter-spacing:.12em}h1{margin:8px 0 14px;font-size:clamp(2.4rem,6vw,5rem);line-height:1.02;letter-spacing:-.045em}.lead{max-width:720px;color:var(--muted)}
.services{margin-top:44px;border-top:1px solid var(--line)}.service{display:grid;grid-template-columns:64px 1fr minmax(250px,.7fr);gap:28px;padding:34px 0;border-bottom:1px solid var(--line)}.no{color:var(--accent);font-weight:800}.service h2{margin:0 0 8px;font-size:clamp(1.4rem,3vw,2.2rem)}.service p{margin:0;color:var(--muted);font-size:.9rem}.actions{display:flex;flex-wrap:wrap;gap:8px;align-content:start}.btn{display:inline-block;padding:9px 15px;border-radius:999px;border:1px solid var(--line);text-decoration:none;font-size:.8rem;font-weight:800}.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.support{margin-top:40px;padding:26px;background:var(--soft);border:1px solid var(--line);border-radius:20px}.support b{display:block;margin-bottom:5px}.support span{color:var(--muted);font-size:.82rem}
footer{border-top:1px solid var(--line);padding:26px 0 34px;color:var(--muted);font-size:.75rem}.foot{display:flex;justify-content:space-between;gap:14px}.foot a{color:var(--accent);text-decoration:none}
@media(max-width:700px){.service{grid-template-columns:44px 1fr}.actions{grid-column:2}}@media(max-width:480px){.service{grid-template-columns:1fr}.actions{grid-column:1}.foot{display:block}.foot a{display:inline-block;margin-top:8px}}
</style>
</head>
<body>
<header><div class="wrap nav"><div class="brand">小佑的日常生活</div><a href="https://daily-user.vercel.app/sitemap">網站地圖</a></div></header>
<main class="wrap">
<div class="eyebrow">服務總覽</div>
<h1>一個入口，找到所有日常服務。</h1>
<p class="lead">目前公開服務分為會員、代繳費與預約管理。各平台維持自己的資料與登入流程，透過共通導覽互相連結。</p>
<section class="services">
<article class="service"><div class="no">01</div><div><h2>行動會員</h2><p>會員、訂單、帳單、優惠券、電子發票、物流、先享後付與客服等會員服務。</p></div><div class="actions"><a class="btn primary" href="https://daily-user.vercel.app/">進入行動會員</a></div></article>
<article class="service"><div class="no">02</div><div><h2>生活代繳費</h2><p>提供代繳費項目、預定繳費、繳費紀錄與客戶查詢等服務。</p></div><div class="actions"><a class="btn primary" href="https://daily-pay-user.vercel.app/">進入生活代繳費</a></div></article>
<article class="service"><div class="no">03</div><div><h2>預約管理</h2><p>查看可預約時段、建立預約並管理既有預約行程。</p></div><div class="actions"><a class="btn primary" href="https://daily-reserve-user.vercel.app/">進入預約管理</a></div></article>
</section>
<div class="support"><b>需要協助？</b><span>可由統一客服中心取得服務協助。客服時間：每日 09:00－22:00。</span></div>
</main>
<footer><div class="wrap foot"><div>© 2026 小佑的日常生活</div><a href="https://daily-user.vercel.app/">返回行動會員</a></div></footer>
</body></html>
