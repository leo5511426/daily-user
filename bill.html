<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>頁面無效｜小佑的日常生活</title>
<style>
:root{--bg:#fff8fa;--card:#fffdfd;--soft:#fff0f4;--line:#f0cbd7;--text:#4b3d42;--muted:#8c777e;--pink:#d982a0;--strong:#b85f7e}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft JhengHei","Noto Sans TC",sans-serif;display:flex;flex-direction:column}
main{flex:1;width:min(640px,calc(100% - 32px));margin:auto;display:flex;align-items:center;justify-content:center;padding:48px 0}
.box{width:100%;padding:34px 28px;background:var(--card);border:1px solid var(--line);border-radius:14px;text-align:center}
.code{font-size:.75rem;font-weight:800;color:var(--strong);letter-spacing:.04em}
h1{margin:8px 0 10px;font-size:1.8rem;letter-spacing:-.03em}
p{margin:0;color:var(--muted);font-size:.9rem;line-height:1.8}
.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:24px}
.actions a{padding:10px 16px;border-radius:9px;text-decoration:none;font-size:.85rem;font-weight:750}
.primary{background:var(--pink);color:#fff}.secondary{border:1px solid var(--line);color:var(--strong);background:var(--soft)}
footer{border-top:1px solid var(--line);padding:24px 16px 30px;text-align:center;color:var(--muted);font-size:.74rem;line-height:1.85}
footer a{color:var(--strong);text-decoration:none}
</style>
</head>
<body>
<main>
  <section class="box">
    <div class="code">錯誤代碼 404</div>
    <h1>這個頁面目前無法使用。</h1>
    <p>網址可能已失效或不存在。請返回行動會員首頁，或由服務總覽重新選擇需要的服務。</p>
    <div class="actions">
      <a class="primary" href="/">返回行動會員首頁</a>
      <a class="secondary" href="/services">前往服務總覽</a>
    </div>
  </section>
</main>
<footer>
  <div><strong style="color:var(--strong)">小佑的日常生活</strong>｜讓日常生活，多一點便利。</div>
  <div>客服時間：每日 09:00－22:00｜<a href="tel:+886966236830">0966-236-830</a>｜<a href="mailto:leo5511426@gmail.com">leo5511426@gmail.com</a></div>
  <div>© 2026 小佑的日常生活</div>
</footer>
</body>
</html>
