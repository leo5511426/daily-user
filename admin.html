<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>小佑的日常生活行動會員－後台</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        :root { --primary: #4f46e5; --dark: #0f172a; --bg: #f8fafc; --accent: #db2777; --green: #10b981; --red: #ff5252; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); margin: 0; padding: 15px; font-weight: bold; }
        .card { background: white; padding: 20px; border-radius: 15px; margin-bottom: 15px; border: 1px solid #eee; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 15px; }
        .m-btn { background: white; padding: 20px; border-radius: 15px; text-align: center; border: 1px solid #ddd; cursor: pointer; font-size: 15px; }
        .full-btn { grid-column: span 2; background: var(--dark); color: white; border: none; font-size: 18px; }
        input, select, button { width: 100%; padding: 14px; margin: 8px 0; border-radius: 12px; border: 1px solid #ddd; box-sizing: border-box; font-size: 16px; font-weight: bold; }
        button { background: var(--primary); color: white; border: none; cursor: pointer; }
        #reader-modal { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:#000; z-index:5000; flex-direction:column; }
        #reader { width: 100%; flex: 1; }
        .modal { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); z-index:1000; align-items:center; justify-content:center; backdrop-filter: blur(4px); }
        .modal-content { background: white; width: 90%; max-width: 400px; padding: 25px; border-radius: 25px; text-align: center; }
        .quick-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
        .q-btn { padding: 15px; border-radius: 12px; border: none; color: white; font-weight: bold; }
        
        /* 讓 SweetAlert2 的字體與粗體符合系統規範 */
        .swal2-popup { font-family: -apple-system, sans-serif; font-weight: bold; border-radius: 20px !important; }
    </style>
</head>
<body>

<div id="reader-modal">
    <div id="reader"></div>
    <button onclick="stopScan()" style="background:var(--red); border-radius:0; margin:0; height:80px; font-size:20px; color:white; border:none; width:100%;">關閉相機</button>
</div>

<div id="quickActionModal" class="modal">
    <div class="modal-content">
        <h2 id="targetName" style="margin-top:0; color:var(--primary);"></h2>
        <p id="targetDesc" style="white-space: pre-line; color:#666; line-height:1.6;"></p>
        <div id="quickBtns" class="quick-grid">
            <button class="q-btn" style="background:var(--primary)" onclick="quickGo('add')">💰 加值</button>
            <button class="q-btn" style="background:var(--dark)" onclick="quickGo('sub')">🛒 扣款</button>
            <button class="q-btn" style="background:var(--green)" onclick="quickGo('pay')">🤝 還款</button>
            <button class="q-btn" style="background:var(--accent)" onclick="quickGo('redeem')">🎟️ 核銷</button>
        </div>
        <div id="couponRedeemBtn" style="display:none;">
            <button onclick="submitRedeem()" style="background:var(--accent); font-size:18px; padding:20px;">立即核銷此券</button>
        </div>
        <button onclick="closeQuick()" style="background:none; color:#999; margin-top:15px; border:none; font-size:14px;">取消</button>
    </div>
</div>

<h2 style="text-align:center; letter-spacing:1px;">小佑管理後台</h2>

<div class="menu-grid">
    <button class="m-btn full-btn" onclick="startScan()">📷 啟動掃描 (人/券自動識別)</button>
    <div class="m-btn" onclick="openWiz('add')">💰 手動加值</div>
    <div class="m-btn" onclick="openWiz('sub')">🛒 手動扣款</div>
    <div class="m-btn" onclick="openWiz('pay')">🤝 還款入帳</div>
    <div class="m-btn" onclick="openWiz('redeem')">🎟️ 優惠核銷</div>
</div>

<div class="card">
    <h3 style="margin:0 0 10px;">🏦 快速撥款</h3>
    <select id="l_uid"></select>
    <input type="text" id="l_item" placeholder="項目 (如: 午餐借支)">
    <input type="number" id="l_amt" placeholder="金額">
    <input type="date" id="l_exp">
    <button onclick="addLoan()" style="background:var(--accent)">發放借款</button>
</div>

<div class="card">
    <h3 style="margin:0 0 10px;">🎟️ 發送優惠券</h3>
    <select id="cp_uid"></select>
    <input type="text" id="cp_id" placeholder="券ID (例如: CP1001)">
    <input type="text" id="cp_title" placeholder="優惠券名稱 (例如: 甜點免費兌換券)">
    <input type="text" id="cp_content" placeholder="優惠詳細說明 (例如: 憑券可享大杯鮮奶茶乙杯)">
    <input type="date" id="cp_exp">
    <button onclick="sendCouponSubmit()" style="background:var(--primary)">確認發送優惠券</button>
</div>

<div id="wizModal" class="modal">
    <div class="modal-content"><div id="wizBody"></div><button onclick="wizNext()" id="nextBtn">下一步</button><p onclick="closeModal()" style="color:#999; cursor:pointer; margin-top:15px;">取消</p></div>
</div>

<script>
    const GAS = "https://script.google.com/macros/s/AKfycbzjLpoEQND1fS_c0IRk70t6TE4R5INgxPQiscdKwoNB86o8XYI9cjVL-4URrvk1KGEJ/exec"; 
    let U_DB = [], L_DB = [], CP_DB = [], CUR_MODE = "", CUR_STEP = 0, FORM = {};
    let html5QrCode;

    window.onload = refresh;

    function showMask(text) { 
        Swal.fire({
            title: text,
            allowOutsideClick: false,
            didOpen: () => {
                Swal.showLoading();
            }
        });
    }
    
    function hideMask() { 
        Swal.close(); 
    }

    function showAlert(title, text, icon = 'info') {
        Swal.fire({
            title: title,
            text: text,
            icon: icon,
            confirmButtonColor: 'var(--primary)',
            confirmButtonText: '確定'
        });
    }

    async function refresh() {
        showMask("讀取雲端資料...");
        try {
            const res = await fetch(GAS, {method:'POST', body:JSON.stringify({action:'fetchData', uid:'admin'})}).then(r=>r.json());
            U_DB = res.list || []; L_DB = res.loans || []; CP_DB = res.coupons || [];
            
            const userOptions = U_DB.map(u => `<option value="${u.id}">${u.name} (餘:$${u.bal})</option>`).join('');
            document.getElementById('l_uid').innerHTML = userOptions;
            document.getElementById('cp_uid').innerHTML = userOptions;
            hideMask();
        } catch(e) { showAlert("同步失敗", e, "error"); }
    }

    function startScan() {
        document.getElementById('reader-modal').style.display = 'flex';
        html5QrCode = new Html5Qrcode("reader");
        html5QrCode.start({ facingMode: "environment" }, { fps: 15, qrbox: 250 }, (decodedText) => {
            let code = decodedText.trim();
            if (code.includes("CP|")) code = code.split("CP|")[1];
            stopScan();
            if (code.startsWith("CP")) {
                const cp = CP_DB.find(c => String(c.id) === code);
                if (cp) {
                    if (cp.status === "已核銷" || cp.status === "已使用") { 
                        showAlert("提示", "此券已核銷過！", "warning"); 
                        return; 
                    }
                    FORM.cpId = code;
                    const owner = U_DB.find(u => u.id === cp.uid);
                    document.getElementById('targetName').innerText = "🎟️ 識別到優惠券";
                    document.getElementById('targetDesc').innerText = `券名：${cp.title}\n持有人：${owner ? owner.name : '未知'}`;
                    document.getElementById('quickBtns').style.display = 'none';
                    document.getElementById('couponRedeemBtn').style.display = 'block';
                    document.getElementById('quickActionModal').style.display = 'flex';
                } else { showAlert("查無此券", "找不到券號：" + code, "error"); }
            } else {
                const user = U_DB.find(u => u.id === code);
                if (user) {
                    FORM.uid = code;
                    document.getElementById('targetName').innerText = user.name;
                    document.getElementById('targetDesc').innerText = `目前餘額：$${user.bal}\n請選擇操作項目`;
                    document.getElementById('quickBtns').style.display = 'grid';
                    document.getElementById('couponRedeemBtn').style.display = 'none';
                    document.getElementById('quickActionModal').style.display = 'flex';
                } else { showAlert("查無此人", "找不到使用者識別碼：" + code, "error"); }
            }
        });
    }

    function stopScan() { if(html5QrCode) html5QrCode.stop().then(() => { document.getElementById('reader-modal').style.display = 'none'; }).catch(()=>{}); }
    function quickGo(mode) { document.getElementById('quickActionModal').style.display = 'none'; openWiz(mode, FORM.uid); }
    function closeQuick() { document.getElementById('quickActionModal').style.display = 'none'; FORM = {}; }

    const FLOWS = {
        add: [{t:"選擇對象",f:"uid",type:"user"},{t:"加值金額",f:"amt",type:"number"},{t:"備註 (選填)",f:"note",type:"text"}],
        sub: [{t:"選擇對象",f:"uid",type:"user"},{t:"扣款金額",f:"amt",type:"number"},{t:"備註 (選填)",f:"note",type:"text"}],
        pay: [{t:"還款人",f:"uid",type:"user"},{t:"選擇帳單",f:"loanRef",type:"loan"},{t:"收現金",f:"cash",type:"number"},{t:"扣點數",f:"bal",type:"number"}],
        redeem: [{t:"持券人",f:"uid",type:"user"},{t:"選擇核銷券",f:"cpId",type:"cpSelect"}]
    };

    function openWiz(m, prefilledUid = null) {
        CUR_MODE = m; CUR_STEP = 0;
        if(prefilledUid) { FORM.uid = prefilledUid; CUR_STEP = 1; } else { FORM = {}; }
        document.getElementById('wizModal').style.display = 'flex';
        renderWiz();
    }

    function renderWiz() {
        const s = FLOWS[CUR_MODE][CUR_STEP];
        let h = `<h3 style="color:var(--primary)">${s.t}</h3>`;
        if(s.type === 'user') h += `<select id="win">${U_DB.map(u=>`<option value="${u.id}">${u.name}</option>`).join('')}</select>`;
        else if(s.type === 'loan') {
            const myL = L_DB.filter(l => l.uid === FORM.uid && l.status !== '已結清' && l.status !== 'processed_cleared');
            h += myL.length ? `<select id="win" onchange="checkOverdue(this.value)"><option value="">-- 請選擇 --</option>${myL.map(l=>`<option value="${l.row}">${l.item} ($${l.total-l.paid})</option>`).join('')}</select>` : `<p>目前無任何欠款或待結清帳單紀錄</p>`;
        } else if(s.type === 'cpSelect') {
            const myCP = CP_DB.filter(c => c.uid === FORM.uid && c.status !== '已核銷' && c.status !== '已使用');
            h += myCP.length ? `<select id="win">${myCP.map(c=>`<option value="${c.id}">${c.title}</option>`).join('')}</select>` : `<p>目前無有效未使用之優惠券</p>`;
        } else {
            const preVal = (CUR_MODE === 'pay' && s.f === 'cash') ? (FORM.suggestedAmt || "") : "";
            h += `<input id="win" type="${s.type}" value="${preVal}" autofocus placeholder="請在此輸入...">`;
        }
        document.getElementById('wizBody').innerHTML = h;
        document.getElementById('nextBtn').innerText = (CUR_STEP === FLOWS[CUR_MODE].length - 1) ? "確認執行" : "下一步";
    }

    function checkOverdue(row) {
        if(!row) return;
        const l = L_DB.find(x => String(x.row) === String(row));
        const today = new Date(); today.setHours(0,0,0,0);
        const exp = new Date(l.expiry); exp.setHours(0,0,0,0);
        const principalLeft = l.total - l.paid; 
        
        let penalty = 0;
        if(today > exp) {
            const days = Math.ceil(Math.abs(today - exp) / 86400000);
            penalty = days * 10;
            Swal.fire({
                title: '🚨 逾期催收警告',
                html: `此筆款項已逾期 <b style="color:var(--red);">${days}</b> 天！<br>衍生追加罰金：<b>$${penalty}</b><br>目前應付總額(剩餘本金+罰金)：<b style="color:var(--accent); font-size:1.2em;">$${principalLeft + penalty}</b>`,
                icon: 'warning',
                confirmButtonColor: 'var(--red)'
            });
            FORM.suggestedAmt = principalLeft + penalty;
        } else {
            FORM.suggestedAmt = principalLeft;
        }
    }

    async function wizNext() {
        const inputEl = document.getElementById('win');
        if(inputEl) FORM[FLOWS[CUR_MODE][CUR_STEP].f] = inputEl.value;
        
        if(CUR_STEP < FLOWS[CUR_MODE].length - 1) { 
            CUR_STEP++; 
            renderWiz(); 
        } else {
            // 還款模式客製化註記與金額修正
            if(CUR_MODE === 'pay') {
                const targetLoan = L_DB.find(l => String(l.row) === String(FORM.loanRef));
                const loanName = targetLoan ? targetLoan.item : "未知帳單";
                
                let payDetails = [];
                let cashAmt = parseFloat(FORM.cash) || 0;
                let balAmt = parseFloat(FORM.bal) || 0;
                
                if(cashAmt > 0) payDetails.push(`現金收款:$${cashAmt}`);
                if(balAmt > 0) payDetails.push(`餘額扣款:$${balAmt}`);
                
                // 動態組合：還款紀錄 (帳單名稱) (支付明細)
                FORM.note = `還款紀錄 (${loanName})` + (payDetails.length > 0 ? ` (${payDetails.join(',')})` : '');
                
                // 重要修正：確保變動數值傳遞給後端時既設定點數變動量為 0，同時提供必要欄位供後端 Transactions 寫入
                FORM.amt = 0; 
                FORM.item = FORM.note; // 同步綁定項目欄位名稱，防範後端 GAS 僅讀取 item 而不讀取 note 的狀況
            }

            closeModal(); showMask("執行中...");
            try {
                const res = await fetch(GAS, {method:'POST', body:JSON.stringify({action:'adminAction', type:CUR_MODE, ...FORM})}).then(r=>r.json());
                
                Swal.fire({
                    title: res.success ? '執行成功' : '執行回報',
                    text: res.message,
                    icon: res.success ? 'success' : 'info',
                    confirmButtonColor: 'var(--primary)'
                }).then(() => {
                    location.reload();
                });
            } catch(e) { showAlert("錯誤", "後台端發送失敗，請確認網路連線。", "error"); }
        }
    }

    async function addLoan() {
        const data = { uid: document.getElementById('l_uid').value, item: document.getElementById('l_item').value, total: document.getElementById('l_amt').value, loanDate: new Date(), expiry: document.getElementById('l_exp').value };
        if(!data.item || !data.total || !data.expiry) return showAlert("提示", "請填寫完整借貸撥款欄位資訊！", "warning");
        showMask("撥款中...");
        try {
            await fetch(GAS, {method:'POST', body:JSON.stringify({action:'addLoan', data})});
            Swal.fire({ title: '發放借款成功', text: '款項與還款期限已正式記入該會員帳下。', icon: 'success', confirmButtonColor: 'var(--primary)' }).then(() => { location.reload(); });
        } catch(e) { showAlert("發放失敗", "連線錯誤，無法完成撥款手續。", "error"); }
    }

    async function sendCouponSubmit() {
        const uid = document.getElementById('cp_uid').value;
        const cpId = document.getElementById('cp_id').value.trim();
        const title = document.getElementById('cp_title').value.trim();
        const content = document.getElementById('cp_content').value.trim();
        const expiry = document.getElementById('cp_exp').value;

        if(!cpId || !title || !content || !expiry) return showAlert("提示", "請填寫完整優惠券資訊！", "warning");
        
        showMask("正在發送優惠券...");
        try {
            const res = await fetch(GAS, {
                method: 'POST',
                body: JSON.stringify({ action: 'adminAction', type: 'sendCoupon', uid: uid, cpId: cpId, title: title, content: content, expiry: expiry })
            }).then(r => r.json());
            
            Swal.fire({ title: '發送完畢', text: res.message, icon: 'success', confirmButtonColor: 'var(--primary)' }).then(() => { location.reload(); });
        } catch(e) { showAlert("發送失敗", "連線發送失敗，請確認後端 GAS 是否已正確佈署與發佈。", "error"); }
    }
    
    function closeModal() { document.getElementById('wizModal').style.display='none'; }
    
    async function submitRedeem() {
        closeQuick(); showMask("核銷中...");
        try {
            const res = await fetch(GAS, {method:'POST', body:JSON.stringify({action:'adminAction', type:'redeem', cpId: FORM.cpId})}).then(r=>r.json());
            Swal.fire({ title: '核銷結果', text: res.message, icon: res.success ? 'success' : 'info', confirmButtonColor: 'var(--primary)' }).then(() => { location.reload(); });
        } catch(e) { showAlert("核銷失敗", "連線異常，無法寫入核銷狀態。", "error"); }
    }
</script>
</body>
</html>
