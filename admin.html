<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>小佑的日常生活行動會員－後台</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        :root { --primary: #4f46e5; --dark: #0f172a; --bg: #f8fafc; --accent: #db2777; --green: #10b981; --red: #ff5252; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); margin: 0; padding: 15px; font-weight: bold; }
        .card { background: white; padding: 20px; border-radius: 15px; margin-bottom: 15px; border: 1px solid #eee; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 15px; }
        .m-btn { background: white; padding: 20px; border-radius: 15px; text-align: center; border: 1px solid #ddd; cursor: pointer; font-size: 15px; }
        .full-btn { grid-column: span 2; background: var(--dark); color: white; border: none; font-size: 18px; }
        input, select, button { width: 100%; padding: 14px; margin: 8px 0; border-radius: 12px; border: 1px solid #ddd; box-sizing: border-box; font-size: 16px; font-weight: bold; }
        button { background: var(--primary); color: white; border: none; cursor: pointer; }
        #reader-modal { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:#000; z-index:5000; flex-direction:column; }
        #reader { width: 100%; flex: 1; }
        .modal { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); z-index:1000; align-items:center; justify-content:center; backdrop-filter: blur(4px); }
        .modal-content { background: white; width: 90%; max-width: 400px; padding: 25px; border-radius: 25px; text-align: center; }
        .quick-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
        .q-btn { padding: 15px; border-radius: 12px; border: none; color: white; font-weight: bold; }
        
        .section-label { font-size: 0.85em; opacity: 0.7; margin-top: 10px; display: block; color: var(--dark); }
        .calc-box { background: #f1f5f9; padding: 12px; border-radius: 10px; margin: 8px 0; font-size: 0.95em; color: var(--dark); }
        .item-row { display: flex; gap: 6px; margin-bottom: 8px; align-items: center; }
        .item-row input { padding: 10px; margin: 0; font-size: 14px; }
        .btn-mini { width: auto; padding: 8px 12px; margin: 0; font-size: 13px; border-radius: 8px; }
        
        .swal2-popup { font-family: -apple-system, sans-serif; font-weight: bold; border-radius: 20px !important; }

        /* 📍 管理端時間線專屬樣式 */
        .admin-timeline { margin-top: 15px; padding-left: 5px; }
        .admin-node { position: relative; padding-left: 24px; padding-bottom: 15px; cursor: pointer; transition: 0.2s; }
        .admin-node:hover { background: #f1f5f9; border-radius: 8px; }
        .admin-node::before { content: ''; position: absolute; left: 4px; top: 6px; bottom: 0; width: 2px; background: #cbd5e1; }
        .admin-node:last-child::before { display: none; }
        .admin-node::after { content: ''; position: absolute; left: 0; top: 5px; width: 10px; height: 10px; border-radius: 50%; background: #94a3b8; }
        .admin-node.latest-node::after { background: var(--accent); box-shadow: 0 0 0 4px rgba(219, 39, 119, 0.2); }
        .admin-node.latest-node::before { background: var(--accent); }
        .admin-node-title { font-size: 0.95em; font-weight: bold; color: var(--dark); margin-bottom: 2px; }
        .admin-node.latest-node .admin-node-title { color: var(--accent); }
        .admin-node-time { font-size: 0.75em; font-weight: bold; opacity: 0.6; color: var(--dark); margin-bottom: 3px; }
        .admin-node.latest-node .admin-node-time { color: var(--accent); opacity: 0.85; }
        .admin-node-desc { font-size: 0.8em; opacity: 0.75; color: var(--dark); line-height: 1.4; }
    </style>
</head>
<body>

<div id="reader-modal">
    <div id="reader"></div>
    <button onclick="stopScan()" style="background:var(--red); border-radius:0; margin:0; height:80px; font-size:20px; color:white; border:none; width:100%;">關閉相機</button>
</div>

<div id="quickActionModal" class="modal">
    <div class="modal-content">
        <h2 id="targetName" style="margin-top:0; color:var(--primary);"></h2>
        <p id="targetDesc" style="white-space: pre-line; color:#666; line-height:1.6;"></p>
        <div id="quickBtns" class="quick-grid">
            <button class="q-btn" style="background:var(--primary)" onclick="quickGo('add')">💰 加值</button>
            <button class="q-btn" style="background:var(--dark)" onclick="quickGo('sub')">🛒 扣款</button>
            <button class="q-btn" style="background:var(--green)" onclick="quickGo('pay')">🤝 還款</button>
            <button class="q-btn" style="background:var(--accent)" onclick="quickGo('redeem')">🎟️ 核銷</button>
        </div>
        <div id="couponRedeemBtn" style="display:none;">
            <button onclick="submitRedeem()" style="background:var(--accent); font-size:18px; padding:20px;">立即核銷此券</button>
        </div>
        <button onclick="closeQuick()" style="background:none; color:#999; margin-top:15px; border:none; font-size:14px;">取消</button>
    </div>
</div>

<h2 style="text-align:center; letter-spacing:1px;">小佑管理後台</h2>

<div class="menu-grid">
    <button class="m-btn full-btn" onclick="startScan()">📷 啟動掃描 (人/券自動識別)</button>
    <div class="m-btn" onclick="openWiz('add')">💰 手動加值</div>
    <div class="m-btn" onclick="openWiz('sub')">🛒 手動扣款</div>
    <div class="m-btn" onclick="openWiz('pay')">🤝 還款入帳</div>
    <div class="m-btn" onclick="openWiz('redeem')">🎟️ 優惠核銷</div>
</div>

<div class="card">
    <h3 style="margin:0 0 10px;">🏦 快速撥款</h3>
    <select id="l_uid"></select>
    <input type="text" id="l_item" placeholder="項目 (如: 午餐借支)">
    <input type="number" id="l_amt" placeholder="金額">
    <input type="date" id="l_exp">
    <button onclick="addLoan()" style="background:var(--accent)">發放借款</button>
</div>

<div class="card">
    <h3 style="margin:0 0 10px;">🎟️ 發送優惠券</h3>
    <select id="cp_uid"></select>
    <input type="text" id="cp_id" placeholder="券ID (例如: CP1001)">
    <input type="text" id="cp_title" placeholder="優惠券名稱 (例如: 甜點免費兌換券)">
    <input type="text" id="cp_content" placeholder="優惠詳細說明 (例如: 憑券可享大杯鮮奶茶乙杯)">
    <input type="date" id="cp_exp">
    <button onclick="sendCouponSubmit()" style="background:var(--primary)">確認發送優惠券</button>
</div>

<div class="card">
    <h3 style="margin:0 0 10px;">📦 手動新增訂單</h3>
    
    <label class="section-label">訂單編號 / 單號：</label>
    <input type="text" id="o_new_id" placeholder="例如: ORD2026053001">
    
    <label class="section-label">選擇購買對象 (會員ID)：</label>
    <select id="o_new_uid"></select>
    
    <label class="section-label">初始訂單狀態 (同步試算表 C 欄 物流狀態)：</label>
    <select id="o_new_status" onchange="toggleVerificationCodeField()"></select>

    <div id="v_code_container" style="display: none;">
        <label class="section-label" style="color: var(--accent);">🔑 取件驗證碼 (非強制填寫)：</label>
        <input type="text" id="o_new_vcode" placeholder="例如: 8852">
    </div>

    <label class="section-label">🛍️ 商品明細填寫：</label>
    <div id="order_items_container">
        <div class="item-row">
            <input type="text" class="item-name" placeholder="商品名稱" style="flex: 2;">
            <input type="text" class="item-spec" placeholder="規格/選項" style="flex: 1.5;">
            <input type="number" class="item-qty" placeholder="數量" min="1" value="1" style="flex: 1;" oninput="calculateTotalOrderAmount()">
            <input type="number" class="item-price" placeholder="價格" min="0" value="0" style="flex: 1.2;" oninput="calculateTotalOrderAmount()">
            <button type="button" class="btn-mini" style="background: var(--red);" onclick="removeOrderItemRow(this)">刪</button>
        </div>
    </div>
    <button type="button" class="btn-mini" style="background: var(--dark); margin-bottom: 12px; width: 100%;" onclick="addOrderItemRow()">＋ 新增商品品項</button>

    <div class="calc-box">
        💰 商品小計：$ <span id="lbl_subtotal">0</span>
    </div>

    <div style="display: flex; gap: 8px;">
        <div>
            <label class="section-label">運費：</label>
            <input type="number" id="o_new_shipping" value="0" min="0" oninput="calculateTotalOrderAmount()">
        </div>
        <div>
            <label class="section-label">運費折扣：</label>
            <input type="number" id="o_new_ship_discount" value="0" min="0" oninput="calculateTotalOrderAmount()">
        </div>
    </div>

    <div style="display: flex; gap: 6px;">
        <div>
            <label class="section-label">賣家折扣：</label>
            <input type="number" id="o_new_seller_discount" value="0" min="0" oninput="calculateTotalOrderAmount()">
        </div>
        <div>
            <label class="section-label">蝦幣折扣：</label>
            <input type="number" id="o_new_coin_discount" value="0" min="0" oninput="calculateTotalOrderAmount()">
        </div>
    </div>

    <div class="calc-box" style="background: #fee2e2; color: #b91c1c; font-size: 1.1em;">
        🚨 訂單總金額 (自動計算)：$ <span id="lbl_total_amount">0</span>
    </div>

    <label class="section-label">🚚 物流方式 (同步試算表 A 欄 物流方式)：</label>
    <select id="o_new_log_method"></select>

    <label class="section-label">🏪 收件門市 / 配送地址快速選擇 (同步試算表 B 欄 門市清單)：</label>
    <select id="o_new_address_select" onchange="syncAddressSelectToInput()"></select>
    <input type="text" id="o_new_address" placeholder="或在此處手動輸入修改門市/配送地址">

    <label class="section-label">📦 物流追蹤編號：</label>
    <input type="text" id="o_new_log_id" placeholder="請輸入包裹物流單號">

    <label class="section-label">📝 物流狀態註記 / 備註：</label>
    <input type="text" id="o_new_log_note" placeholder="例如：包裹已抵達高雄鼓山門市">

    <label class="section-label">📅 訂單成立時間：</label>
    <input type="datetime-local" id="o_new_time">
    
    <button onclick="createNewOrderSubmit()" style="background:var(--green)">確認建立全新訂單</button>
</div>

<div class="card">
    <h3 style="margin:0 0 10px;">⏳ 編輯訂單物流時間線</h3>
    <label style="font-size:0.85em; opacity:0.7;">選擇目標訂單：</label>
    <select id="t_order_id" onchange="renderAdminTimeline()"></select>
    
    <div id="admin_timeline_container" style="margin: 15px 0; max-height: 250px; overflow-y: auto; background: #f8fafc; padding: 10px; border-radius: 10px; border: 1px solid #e2e8f0;">
        <p style="text-align: center; color: #94a3b8; font-size: 0.9em; margin: 0;">請先選擇訂單以查看時間線</p>
    </div>

    <div style="border-top: 1px dashed #ccc; padding-top: 15px; margin-top: 15px;">
        <h4 style="margin: 0 0 10px 0; color: var(--primary);">➕ 發佈最新物流進度</h4>
        <label style="font-size:0.85em; opacity:0.7;">更新時間節點：</label>
        <input type="datetime-local" id="t_log_time">
        
        <label style="font-size:0.85em; opacity:0.7;">變更物流狀態 (同步試算表 C 欄)：</label>
        <select id="t_log_status"></select>

        <label style="font-size:0.85em; opacity:0.7;">狀態備註 / 註記：</label>
        <input type="text" id="t_log_note" placeholder="例如：買家已取件，感謝購買">
        
        <button onclick="updateOrderTimelineSubmit()" style="background:var(--dark)">發佈最新節點紀錄</button>
    </div>
</div>

<div id="wizModal" class="modal">
    <div class="modal-content">
        <div id="wizBody"></div>
        <button onclick="wizNext()" id="nextBtn">下一步</button>
        <p onclick="closeModal()" style="color:#999; cursor:pointer; margin-top:15px;">取消</p>
    </div>
</div>

<script>
    // ⚠️ 請確保此處為您自己發佈的應用程式網址
    const GAS = "https://script.google.com/macros/s/AKfycbzXHZBEhaN7rxJQ1PRfWYiD74CiSmmwO_zN-k0tdvtfkfoo_Yp64biBVV-74p6AtKHu/exec"; 
    
    let U_DB = [], L_DB = [], CP_DB = [], O_DB = [], SETTINGS = {}, CUR_MODE = "", CUR_STEP = 0, FORM = {};
    let html5QrCode;

    window.onload = refresh;

    function showMask(text) { Swal.fire({ title: text, allowOutsideClick: false, didOpen: () => { Swal.showLoading(); } }); }
    function hideMask() { Swal.close(); }
    function showAlert(title, text, icon = 'info') { Swal.fire({ title: title, text: text, icon: icon, confirmButtonColor: 'var(--primary)', confirmButtonText: '確定' }); }

    function getNowDateTimeString() {
        const now = new Date();
        const yyyy = now.getFullYear();
        const mm = String(now.getMonth() + 1).padStart(2, '0');
        const dd = String(now.getDate()).padStart(2, '0');
        const hh = String(now.getHours()).padStart(2, '0');
        const min = String(now.getMinutes()).padStart(2, '0');
        return `${yyyy}-${mm}-${dd}T${hh}:${min}`;
    }

    async function refresh() {
        showMask("正在載入系統資料...");
        try {
            const res = await fetch(GAS, {method:'POST', body:JSON.stringify({action:'fetchData', uid:'admin'})}).then(r=>r.json());
            U_DB = res.list || []; 
            L_DB = res.loans || [];
            CP_DB = res.coupons || [];
            O_DB = res.orders || [];
            SETTINGS = res.settings || {};
            
            updateSelects();
            renderAdminTimeline(); // 重新渲染時間線區塊
            
            const nowTime = getNowDateTimeString();
            document.getElementById('t_log_time').value = nowTime;
            document.getElementById('o_new_time').value = nowTime; 
            
            hideMask();
        } catch(e) {
            hideMask();
            showAlert("錯誤", "載入失敗", "error");
        }
    }

    function updateSelects() {
        const uOptions = U_DB.map(u => `<option value="${u.id}">${u.name} (ID: ${u.id})</option>`).join('');
        document.getElementById('l_uid').innerHTML = uOptions;
        document.getElementById('cp_uid').innerHTML = uOptions;
        document.getElementById('o_new_uid').innerHTML = uOptions;

        const statusOptions = (SETTINGS.orderStatuses || SETTINGS["物流狀態"] || []).map(s => `<option value="${s}">${s}</option>`).join('');
        document.getElementById('o_new_status').innerHTML = statusOptions;
        document.getElementById('t_log_status').innerHTML = statusOptions;

        const logOptions = (SETTINGS.logMethods || SETTINGS["物流方式"] || []).map(m => `<option value="${m}">${m}</option>`).join('');
        document.getElementById('o_new_log_method').innerHTML = logOptions;

        const addrOptions = (SETTINGS.addresses || SETTINGS["門市清單"] || []).map(a => `<option value="${a}">${a}</option>`).join('');
        document.getElementById('o_new_address_select').innerHTML = '<option value="">-- 快速選擇地址 --</option>' + addrOptions;

        // 記住當前選取的訂單 ID
        const currentSelectedOid = document.getElementById('t_order_id').value;
        const orderOptions = O_DB.map(o => `<option value="${o.id}">單號:${o.id} - ${o.item} (${o.status})</option>`).join('') || '<option value="">目前雲端尚無訂單紀錄</option>';
        document.getElementById('t_order_id').innerHTML = orderOptions;
        
        // 若之前有選取，則恢復選取狀態
        if (currentSelectedOid && O_DB.find(o => o.id === currentSelectedOid)) {
            document.getElementById('t_order_id').value = currentSelectedOid;
        }
    }

    // 📍 渲染並顯示管理者端之物流時間線
    function renderAdminTimeline() {
        const container = document.getElementById('admin_timeline_container');
        const orderId = document.getElementById('t_order_id').value;
        if (!orderId) {
            container.innerHTML = `<p style="text-align: center; color: #94a3b8; font-size: 0.9em; margin: 0;">請先選擇訂單以查看時間線</p>`;
            return;
        }

        const order = O_DB.find(o => o.id === orderId);
        if (order && order.timeline && order.timeline.length > 0) {
            const html = order.timeline.map((node, idx) => {
                // 將特殊字元跳脫以策安全
                const safeRawMsg = String(node.rawMsg).replace(/'/g, "\\'").replace(/"/g, "&quot;");
                const safeTime = String(node.time).replace(/'/g, "\\'");
                const safeStatus = String(node.status).replace(/'/g, "\\'");
                const safeNote = String(node.note).replace(/'/g, "\\'");
                
                return `
                <div class="admin-node ${idx === 0 ? 'latest-node' : ''}" onclick="openEditNodeModal('${orderId}', '${safeRawMsg}', '${safeTime}', '${safeStatus}', '${safeNote}')">
                    <div class="admin-node-title">${node.status}</div>
                    <div class="admin-node-time">⏱️ ${node.time}</div>
                    <div class="admin-node-desc">${node.note} <span style="color:#3b82f6; font-size:0.8em; margin-left:5px;">[點擊修改/刪除]</span></div>
                </div>`;
            }).join('');
            container.innerHTML = `<div class="admin-timeline">${html}</div>`;
        } else {
            container.innerHTML = `<p style="text-align: center; color: #94a3b8; font-size: 0.9em; margin: 0;">此訂單尚無詳細的雲端歷史軌跡</p>`;
        }
    }

    // 📍 開啟編輯特定物流節點的視窗 (新增刪除功能)
    async function openEditNodeModal(oid, rawMsg, oldTime, oldStatus, oldNote) {
        // 將 yyyy-MM-dd HH:mm 轉為 datetime-local 支援的 yyyy-MM-ddTHH:mm
        const isoTime = oldTime.replace(' ', 'T');
        const statusOptions = (SETTINGS.orderStatuses || SETTINGS["物流狀態"] || []).map(s => 
            `<option value="${s}" ${s === oldStatus ? 'selected' : ''}>${s}</option>`
        ).join('');

        const result = await Swal.fire({
            title: '✏️ 編輯或刪除物流時間線節點',
            html: `
                <div style="text-align: left; font-size: 0.9em;">
                    <label style="display:block; margin-top:10px; color:var(--dark);">更新時間：</label>
                    <input type="datetime-local" id="edit_log_time" class="swal2-input" value="${isoTime}" style="width: 80%; margin: 5px auto; padding: 10px;">
                    
                    <label style="display:block; margin-top:10px; color:var(--dark);">物流狀態：</label>
                    <select id="edit_log_status" class="swal2-select" style="width: 80%; margin: 5px auto; display:flex; padding: 10px;">
                        ${statusOptions}
                    </select>
                    
                    <label style="display:block; margin-top:10px; color:var(--dark);">狀態備註：</label>
                    <input type="text" id="edit_log_note" class="swal2-input" value="${oldNote}" style="width: 80%; margin: 5px auto; padding: 10px;">
                </div>
            `,
            focusConfirm: false,
            showCancelButton: true,
            showDenyButton: true,
            confirmButtonColor: 'var(--primary)',
            denyButtonColor: 'var(--red)',
            cancelButtonColor: '#94a3b8',
            cancelButtonText: '取消',
            confirmButtonText: '儲存變更',
            denyButtonText: '🗑️ 刪除此節點',
            preConfirm: () => {
                const nt = document.getElementById('edit_log_time').value;
                const ns = document.getElementById('edit_log_status').value;
                const nn = document.getElementById('edit_log_note').value;
                if (!nt) {
                    Swal.showValidationMessage('請確實填寫時間！');
                    return false;
                }
                return { newTime: nt.replace('T', ' '), newStatus: ns, newNote: nn };
            }
        });

        if (result.isConfirmed && result.value) {
            // 執行編輯更新
            showMask("正在覆寫修正雲端節點...");
            try {
                const res = await fetch(GAS, {
                    method: 'POST',
                    body: JSON.stringify({
                        action: 'adminAction',
                        type: 'editTimelineNode',
                        oid: oid,
                        oldRawMsg: rawMsg,
                        newTime: result.value.newTime,
                        newStatus: result.value.newStatus,
                        newNote: result.value.newNote
                    })
                }).then(r => r.json());

                if (res.success) {
                    Swal.fire({ title: '修改成功', text: res.message, icon: 'success' }).then(() => refresh());
                } else {
                    Swal.fire("錯誤", res.message, "error");
                }
            } catch(e) {
                Swal.fire("網路錯誤", "無法連線至雲端服務", "error");
            }
        } else if (result.isDenied) {
            // 執行刪除流程（加上二次確認防呆）
            const confirmDel = await Swal.fire({
                title: '確定要刪除此節點？',
                text: '刪除後將無法復原！',
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: 'var(--red)',
                cancelButtonColor: '#94a3b8',
                confirmButtonText: '確定刪除',
                cancelButtonText: '取消'
            });

            if (confirmDel.isConfirmed) {
                showMask("正在刪除雲端節點...");
                try {
                    const res = await fetch(GAS, {
                        method: 'POST',
                        body: JSON.stringify({
                            action: 'adminAction',
                            type: 'deleteTimelineNode',
                            oid: oid,
                            rawMsg: rawMsg
                        })
                    }).then(r => r.json());

                    if (res.success) {
                        Swal.fire({ title: '刪除成功', text: res.message, icon: 'success' }).then(() => refresh());
                    } else {
                        Swal.fire("錯誤", res.message, "error");
                    }
                } catch(e) {
                    Swal.fire("網路錯誤", "無法連線至雲端服務", "error");
                }
            }
        }
    }

    function addOrderItemRow() {
        const container = document.getElementById('order_items_container');
        const div = document.createElement('div');
        div.className = 'item-row';
        div.innerHTML = `
            <input type="text" class="item-name" placeholder="商品名稱" style="flex: 2;">
            <input type="text" class="item-spec" placeholder="規格/選項" style="flex: 1.5;">
            <input type="number" class="item-qty" placeholder="數量" min="1" value="1" style="flex: 1;" oninput="calculateTotalOrderAmount()">
            <input type="number" class="item-price" placeholder="價格" min="0" value="0" style="flex: 1.2;" oninput="calculateTotalOrderAmount()">
            <button type="button" class="btn-mini" style="background: var(--red);" onclick="removeOrderItemRow(this)">刪</button>
        `;
        container.appendChild(div);
        calculateTotalOrderAmount();
    }

    function removeOrderItemRow(btn) {
        const rows = document.querySelectorAll('.item-row');
        if(rows.length <= 1) return Swal.fire("提示", "至少必須保留一項商品明細！", "warning");
        btn.parentElement.remove();
        calculateTotalOrderAmount();
    }

    function toggleVerificationCodeField() {
        const status = document.getElementById('o_new_status').value;
        const container = document.getElementById('v_code_container');
        container.style.display = (status && (status.includes("抵達門市") || status.includes("待領取") || status.includes("已到貨"))) ? 'block' : 'none';
        if(container.style.display === 'none') document.getElementById('o_new_vcode').value = "";
    }

    function syncAddressSelectToInput() {
        const selectEl = document.getElementById('o_new_address_select');
        if(selectEl.value) document.getElementById('o_new_address').value = selectEl.value;
    }

    function calculateTotalOrderAmount() {
        let subtotal = 0;
        document.querySelectorAll('.item-row').forEach(row => {
            const qty = Number(row.querySelector('.item-qty').value) || 0;
            const price = Number(row.querySelector('.item-price').value) || 0;
            subtotal += (qty * price);
        });
        document.getElementById('lbl_subtotal').innerText = subtotal;
        
        const shipping = Number(document.getElementById('o_new_shipping').value) || 0;
        const shipDiscount = Number(document.getElementById('o_new_ship_discount').value) || 0;
        const sellerDiscount = Number(document.getElementById('o_new_seller_discount').value) || 0;
        const coinDiscount = Number(document.getElementById('o_new_coin_discount').value) || 0;
        
        let totalAmount = subtotal + shipping - shipDiscount - sellerDiscount - coinDiscount;
        document.getElementById('lbl_total_amount').innerText = Math.max(0, totalAmount);
        return { subtotal: subtotal, totalAmount: Math.max(0, totalAmount) };
    }

    function startScan() {
        document.getElementById('reader-modal').style.display = 'flex';
        html5QrCode = new Html5Qrcode("reader");
        html5QrCode.start({ facingMode: "environment" }, { fps: 15, qrbox: 250 }, (decodedText) => {
            let code = decodedText.trim();
            if (code.includes("CP|")) code = code.split("CP|")[1];
            stopScan();
            if (code.startsWith("CP")) {
                const cp = CP_DB.find(c => String(c.id) === code);
                if (cp) {
                    if (cp.status === "已使用" || cp.status === "已核銷") return showAlert("提示", "此券已核銷過！", "warning"); 
                    FORM.cpId = code;
                    const owner = U_DB.find(u => u.id === cp.uid);
                    document.getElementById('targetName').innerText = "🎟️ 識別到優惠券";
                    document.getElementById('targetDesc').innerText = `券名：${cp.title}\n持有人：${owner ? owner.name : '未知'}`;
                    document.getElementById('quickBtns').style.display = 'none';
                    document.getElementById('couponRedeemBtn').style.display = 'block';
                    document.getElementById('quickActionModal').style.display = 'flex';
                } else {
                    showAlert("查無此券", "找不到券號：" + code, "error");
                }
            } else {
                const user = U_DB.find(u => u.id === code);
                if (user) {
                    FORM.uid = code;
                    document.getElementById('targetName').innerText = user.name;
                    document.getElementById('targetDesc').innerText = `目前餘額：$${user.bal}\n請選擇操作項目`;
                    document.getElementById('quickBtns').style.display = 'grid';
                    document.getElementById('couponRedeemBtn').style.display = 'none';
                    document.getElementById('quickActionModal').style.display = 'flex';
                } else {
                    showAlert("查無此人", "找不到使用者識別碼：" + code, "error");
                }
            }
        });
    }

    function stopScan() {
        if(html5QrCode) html5QrCode.stop().then(() => { document.getElementById('reader-modal').style.display = 'none'; }).catch(()=>{});
    }

    function quickGo(mode) {
        document.getElementById('quickActionModal').style.display = 'none';
        openWiz(mode, FORM.uid);
    }
    
    function closeQuick() {
        document.getElementById('quickActionModal').style.display = 'none';
        FORM = {};
    }

    const FLOWS = {
        add: [{t:"選擇對象",f:"uid",type:"user"}, {t:"加值金額",f:"amt",type:"number"}, {t:"備註描述",f:"note",type:"text"}],
        sub: [{t:"選擇對象",f:"uid",type:"user"}, {t:"扣款項目",f:"item",type:"text"}, {t:"扣款金額",f:"amt",type:"number"}, {t:"備註描述",f:"note",type:"text"}],
        pay: [{t:"選擇對象",f:"uid",type:"user"}, {t:"還款金額",f:"amt",type:"number"}, {t:"備註描述",f:"note",type:"text"}],
        redeem: [{t:"請輸入或掃描優惠券ID",f:"cpId",type:"text"}]
    };

    function openWiz(mode, prefilledUid = null) {
        CUR_MODE = mode; CUR_STEP = 0; FORM = {};
        if (prefilledUid) FORM.uid = prefilledUid;
        document.getElementById('wizModal').style.display = 'flex';
        renderStep();
    }

    function closeModal() { document.getElementById('wizModal').style.display = 'none'; }

    function renderStep() {
        const flow = FLOWS[CUR_MODE];
        let stepInfo = flow[CUR_STEP];
        
        if (CUR_STEP === 0 && FORM.uid && stepInfo.f === "uid") {
            CUR_STEP++;
            stepInfo = flow[CUR_STEP];
        }

        let html = `<h3>${stepInfo.t}</h3>`;
        if (stepInfo.type === "user") {
            html += `<select id="wiz_val">${U_DB.map(u => `<option value="${u.id}">${u.name} (餘:$${u.bal})</option>`).join('')}</select>`;
        } else if (stepInfo.type === "number") {
            html += `<input type="number" id="wiz_val" placeholder="請輸入金額">`;
        } else {
            html += `<input type="text" id="wiz_val" placeholder="請輸入內容">`;
        }
        
        document.getElementById('wizBody').innerHTML = html;
        document.getElementById('nextBtn').innerText = (CUR_STEP === flow.length - 1) ? "確認送出" : "下一步";
    }

    function wizNext() {
        const inputEl = document.getElementById('wiz_val');
        const flow = FLOWS[CUR_MODE];
        const field = flow[CUR_STEP].f;
        
        if (!inputEl.value.trim()) return Swal.fire("提示", "欄位不可為空", "warning");
        FORM[field] = inputEl.value.trim();

        if (CUR_STEP < flow.length - 1) {
            CUR_STEP++;
            renderStep();
        } else {
            submitWiz();
        }
    }

    async function submitWiz() {
        closeModal();
        showMask("正在提交資料至雲端試算表...");
        let payload = { action: 'adminAction', type: CUR_MODE, ...FORM };
        try {
            const res = await fetch(GAS, { method: 'POST', body: JSON.stringify(payload) }).then(r => r.json());
            if (res.success) {
                Swal.fire({ title: '操作成功！', text: res.message, icon: 'success' }).then(() => refresh());
            } else {
                showAlert("操作失敗", res.message, "error");
            }
        } catch(e) { showAlert("網路異常", "無法連線至後端系統", "error"); }
    }

    async function submitRedeem() {
        closeQuick(); 
        showMask("正在執行實體優惠券核銷中...");
        try {
            const res = await fetch(GAS, { method: 'POST', body: JSON.stringify({ action: 'adminAction', type: 'redeem', cpId: FORM.cpId }) }).then(r => r.json());
            if(res.success) {
                Swal.fire({ title: '核銷成功！', text: res.message, icon: 'success' }).then(() => refresh());
            } else {
                showAlert("核銷失敗", res.message, "error");
            }
        } catch(e) { showAlert("網路異常", "無法完成核銷作業", "error"); }
    }

    async function addLoan() {
        const uid = document.getElementById('l_uid').value;
        const item = document.getElementById('l_item').value.trim();
        const amt = document.getElementById('l_amt').value.trim();
        const exp = document.getElementById('l_exp').value;
        if(!uid || !item || !amt || !exp) return Swal.fire("提示", "撥款表單欄位填寫不完整！", "warning");

        showMask("正在處理借款撥發中...");
        try {
            const res = await fetch(GAS, {
                method: 'POST',
                body: JSON.stringify({ action: 'adminAction', type: 'addLoan', uid: uid, item: item, amt: Number(amt), expiry: exp })
            }).then(r => r.json());
            
            if(res.success) {
                Swal.fire({ title: '發放完成', text: res.message, icon: 'success' }).then(() => refresh());
                document.getElementById('l_item').value = "";
                document.getElementById('l_amt').value = "";
                document.getElementById('l_exp').value = "";
            } else {
                showAlert("發放失敗", res.message, "error");
            }
        } catch(e) { showAlert("網路異常", "撥款連線失敗", "error"); }
    }

    async function sendCouponSubmit() {
        const uid = document.getElementById('cp_uid').value;
        const cpId = document.getElementById('cp_id').value.trim();
        const title = document.getElementById('cp_title').value.trim();
        const content = document.getElementById('cp_content').value.trim();
        const expiry = document.getElementById('cp_exp').value;

        if(!uid || !cpId || !title || !content || !expiry) return Swal.fire("提示", "請填寫完整優惠券資訊！", "warning");
        
        showMask("正在發送優惠券...");
        try {
            const res = await fetch(GAS, {
                method: 'POST',
                body: JSON.stringify({ action: 'adminAction', type: 'sendCoupon', uid: uid, cpId: cpId, title: title, content: content, expiry: expiry })
            }).then(r => r.json());
            
            if (res.success) {
                Swal.fire({ title: '發送完畢', text: res.message, icon: 'success' }).then(() => refresh());
                document.getElementById('cp_id').value = "";
                document.getElementById('cp_title').value = "";
                document.getElementById('cp_content').value = "";
                document.getElementById('cp_exp').value = "";
            } else {
                showAlert("發送失敗", res.message, "error");
            }
        } catch(e) { showAlert("網路異常", "連線發送失敗", "error"); }
    }

    async function createNewOrderSubmit() {
        const id = document.getElementById('o_new_id').value.trim();
        const uid = document.getElementById('o_new_uid').value;
        const status = document.getElementById('o_new_status').value;
        const vcode = document.getElementById('o_new_vcode').value.trim();
        const time = document.getElementById('o_new_time').value;

        const itemRows = document.querySelectorAll('.item-row');
        let itemsArray = [];
        let itemSummaryText = ""; 

        for (let i = 0; i < itemRows.length; i++) {
            const name = itemRows[i].querySelector('.item-name').value.trim();
            const spec = itemRows[i].querySelector('.item-spec').value.trim();
            const qty = itemRows[i].querySelector('.item-qty').value.trim();
            const price = itemRows[i].querySelector('.item-price').value.trim();

            if(!name || !qty || !price) {
                return Swal.fire("提示", `請確實填寫第 ${i+1} 項商品的名稱、數量與價格！`, "warning");
            }
            itemsArray.push({ name, spec, qty: Number(qty), price: Number(price) });
            itemSummaryText += `${name}${spec ? '('+spec+')' : ''} x${qty}; `;
        }

        const calcData = calculateTotalOrderAmount();
        const shipping = Number(document.getElementById('o_new_shipping').value) || 0;
        const shipDiscount = Number(document.getElementById('o_new_ship_discount').value) || 0;
        const sellerDiscount = Number(document.getElementById('o_new_seller_discount').value) || 0;
        const coinDiscount = Number(document.getElementById('o_new_coin_discount').value) || 0;
        
        const logMethod = document.getElementById('o_new_log_method').value;
        const address = document.getElementById('o_new_address').value.trim(); 
        const logId = document.getElementById('o_new_log_id').value.trim();
        const logNote = document.getElementById('o_new_log_note').value.trim();

        if(!id || !uid || !status || !time || !address) {
            return Swal.fire("提示", "請填寫或選擇必要欄位（單號、對象、狀態、時間與地址）！", "warning");
        }

        const formattedTime = time.replace('T', ' '); 

        showMask("正在建立新訂單並上傳雲端...");
        try {
            const res = await fetch(GAS, {
                method: 'POST',
                body: JSON.stringify({
                    action: 'adminAction',
                    type: 'updateOrder',
                    oid: id,
                    uid: uid,
                    status: status,
                    item: itemSummaryText,
                    code: vcode,
                    subtotal: calcData.subtotal,
                    shipFee: shipping,
                    discShip: shipDiscount,
                    discSeller: sellerDiscount,
                    discCoin: coinDiscount,
                    total: calcData.totalAmount,
                    ship: logMethod,
                    address: address,
                    track: logId,
                    note: logNote,
                    time: formattedTime 
                })
            }).then(r => r.json());

            if (res.success) {
                Swal.fire({ title: '訂單建立成功！', text: '新訂單與精細明細已寫入雲端。', icon: 'success' }).then(() => refresh());
            } else {
                showAlert("建立失敗", res.message, "error");
            }
        } catch(e) {
            showAlert("網路異常", "無法連線至後端建立訂單", "error");
        }
    }

    async function updateOrderTimelineSubmit() {
        const orderId = document.getElementById('t_order_id').value;
        const logTime = document.getElementById('t_log_time').value; 
        const logStatus = document.getElementById('t_log_status').value;
        const logNote = document.getElementById('t_log_note').value; // 新增讀取備註

        if(!orderId) return Swal.fire("提示", "請先選擇有效的訂單！", "warning");
        if(!logTime) return Swal.fire("提示", "請填寫節點更新時間！", "warning");

        const formattedTime = logTime.replace('T', ' '); 

        showMask("正在同步更新物流時間線...");
        try {
            const res = await fetch(GAS, {
                method: 'POST',
                body: JSON.stringify({
                    action: 'adminAction',
                    type: 'updateTimeline',
                    oid: orderId,
                    time: formattedTime, 
                    status: logStatus,
                    note: logNote // 傳遞備註
                })
            }).then(r => r.json());

            if (res.success) {
                Swal.fire({ title: '更新成功', text: '最新物流進度已與雲端同步發佈！', icon: 'success' }).then(() => refresh());
            } else {
                showAlert("更新失敗", res.message, "error");
            }
        } catch(e) {
            showAlert("網路異常", "連線失敗，請檢查網路。", "error");
        }
    }
</script>
