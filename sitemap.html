:root{--bg:#fffafa;--text:#40363a;--muted:#7c6d72;--accent:#b95878;--line:#ead5dc;--soft:#f8e9ee}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;line-height:1.8}.wrap{width:min(1040px,calc(100% - 32px));margin:auto}a{color:inherit}

.group{display:grid;grid-template-columns:190px 1fr;gap:28px;padding:28px 0;border-bottom:1px solid var(--line)}.group h2{margin:0;color:var(--accent);font-size:1rem}.links{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 24px}.links a{padding:6px 0;text-decoration:none;font-size:.88rem}.links a:hover{color:var(--accent)}
.note{margin-top:32px;padding:18px 20px;background:var(--soft);border:1px solid var(--line);border-radius:16px;color:var(--muted);font-size:.8rem}footer{border-top:1px solid var(--line);padding:26px 0 34px;color:var(--muted);font-size:.75rem}
@media(max-width:650px){.group{grid-template-columns:1fr;gap:10px}.links{grid-template-columns:1fr}}
</style>
