<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>小佑的日常生活行動會員</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        :root { 
            --bg: #ffffff; --text: #000; --pink: #FF8FA3; --accent: #FF8FA3; --card: #f5f5f5; 
            --border: #e0e0e0; --nav: #fafafa; --red: #ff5252; --green: #2ecc71; --fs: 18px; 
        }
        [data-theme='dark'] { 
            --bg: #000; --text: #fff; --pink: #FFD1DC; --accent: #FF8FA3; --card: #121212; 
            --border: #252525; --nav: #080808; 
        }
        
        body { 
            font-family: -apple-system, sans-serif; 
            background: #e2e8f0; 
            color: var(--text); 
            margin: 0; 
            font-weight: 900; 
            transition: 0.3s; 
            overflow-x: hidden; 
            font-size: var(--fs); 
            display: flex;
            justify-content: center;
        }

        .app-container {
            width: 100%;
            max-width: 500px; 
            height: 100vh;
            background: var(--bg);
            position: relative;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
            transition: max-width 0.3s ease;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .app-container.full-desktop {
            max-width: 100% !important;
            box-shadow: none;
        }

        .page { 
            width: 100%; 
            height: 100%;
            padding: 40px 20px 110px; 
            box-sizing: border-box; 
            display: none; 
            overflow-y: auto; 
            -webkit-overflow-scrolling: touch;
        }
        .card { background: var(--card); border-radius: 20px; padding: 20px; margin-bottom: 15px; border: 1px solid var(--border); position: relative; }
        .btn { width: 100%; padding: 18px; border-radius: 15px; background: var(--accent); color: #fff; border: none; font-size: 1.1em; font-weight: 900; cursor: pointer; }
        
        .nav-bar { 
            position: fixed; 
            bottom: 0; 
            left: 50%;
            transform: translateX(-50%);
            width: 100%; 
            max-width: 500px; 
            height: 90px; 
            background: var(--nav); 
            display: flex; 
            border-top: 1px solid var(--border); 
            z-index: 100; 
            padding-bottom: env(safe-area-inset-bottom); 
            box-sizing: border-box; 
            transition: max-width 0.3s ease;
        }

        .app-container.full-desktop ~ .nav-bar,
        .full-desktop .nav-bar {
            max-width: 100% !important;
        }

        .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #555; font-size: 0.85em; cursor: pointer; }
        .nav-item.active { color: var(--pink); }
        .mask { display:none; position:absolute; top:0; left:0; width:100%; height:100%; background:var(--bg); z-index:999; flex-direction:column; justify-content:center; align-items:center; }
        input { width:100%; padding:18px; margin:10px 0; border-radius:12px; border:1px solid var(--border); background:var(--card); color:var(--text); box-sizing: border-box; font-size: 1em; }
        .overdue-tag { position: absolute; top: 10px; right: 10px; background: var(--red); color: #fff; padding: 4px 8px; border-radius: 8px; font-size: 0.75em; }
        .note-box { font-size: 0.8em; color: #888; margin-top: 8px; border-top: 1px dashed #333; padding-top: 5px; font-weight: normal; }

        .coupon-tabs, .loan-tabs { display: flex; background: var(--card); border-radius: 12px; padding: 5px; margin-bottom: 15px; border: 1px solid var(--border); }
        .coupon-tab, .loan-tab { flex: 1; text-align: center; padding: 10px 0; font-size: 0.9em; cursor: pointer; border-radius: 8px; color: #888; transition: 0.2s; }
        .coupon-tab.active, .loan-tab.active { background: var(--pink); color: #fff; }
        
        .pwd-toggle-container { display: flex; align-items: center; margin: 5px 0 15px; font-size: 0.9em; cursor: pointer; user-select: none; }
        .pwd-toggle-container input { width: auto; margin: 0 8px 0 0; transform: scale(1.2); }

        .swal2-popup { font-family: -apple-system, sans-serif; font-weight: 900; border-radius: 20px !important; }
        [data-theme='dark'] .swal2-popup { background-color: #121212 !important; color: #fff !important; }
        [data-theme='dark'] .swal2-title, [data-theme='dark'] .swal2-html-container { color: #fff !important; }

        .sync-indicator {
            position: absolute;
            top: 12px;
            left: 15px;
            display: none;
            align-items: center;
            gap: 6px;
            z-index: 110;
            background: rgba(0, 0, 0, 0.05);
            padding: 4px 8px;
            border-radius: 20px;
            pointer-events: none;
        }
        [data-theme='dark'] .sync-indicator {
            background: rgba(255, 255, 255, 0.1);
        }
        .sync-spinner {
            width: 12px;
            height: 12px;
            border: 2px solid var(--border);
            border-top: 2px solid var(--pink);
            border-radius: 50%;
            animation: sync-spin 0.8s linear infinite;
        }
        .sync-text {
            font-size: 0.65em;
            opacity: 0.7;
            letter-spacing: 0.5px;
        }
        @keyframes sync-spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes queue-bounce {
            0% { transform: translateY(0); }
            100% { transform: translateY(-8px); }
        }

        .settings-section-title {
            font-size: 1.1em;
            margin: 20px 0 10px 5px;
            color: var(--pink);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* 📍 排序與標題專用容器 */
        .header-container { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 15px; 
        }
        .header-container h2 { 
            margin: 0; 
        }
        .sort-select { 
            padding: 6px 10px; 
            border-radius: 8px; 
            border: 1px solid var(--border); 
            background: var(--card); 
            color: var(--text); 
            font-size: 0.8em; 
            font-weight: bold; 
            outline: none; 
            cursor: pointer; 
        }

        /* 📍 物流時間線垂直架構與時間樣式 */
        .order-timeline {
            margin: 5px 0 5px 5px;
            padding-left: 5px;
        }
        .timeline-node {
            position: relative;
            padding-left: 24px;
            padding-bottom: 18px;
        }
        .timeline-node:last-child {
            padding-bottom: 5px;
        }
        .timeline-node::before {
            content: '';
            position: absolute;
            left: 4px;
            top: 6px;
            bottom: 0;
            width: 2px;
            background: var(--border);
        }
        .timeline-node:last-child::before { display: none; }
        .timeline-node::after {
            content: '';
            position: absolute;
            left: 0;
            top: 5px;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #a1a1aa;
        }
        .timeline-node.latest-node::after {
            background: var(--pink);
            box-shadow: 0 0 0 4px rgba(255, 143, 163, 0.35);
        }
        .timeline-node.latest-node::before { background: var(--pink); }
        .timeline-node-title {
            font-size: 1em;
            font-weight: 900;
            color: var(--text);
            margin-bottom: 2px;
        }
        .timeline-node.latest-node .timeline-node-title { color: var(--pink); }
        .timeline-node-time {
            font-size: 0.75em;
            font-weight: bold;
            opacity: 0.6;
            color: var(--text);
            margin-bottom: 3px;
        }
        .timeline-node.latest-node .timeline-node-time {
            opacity: 0.85;
            color: var(--pink);
        }
        .timeline-node-desc {
            font-size: 0.8em;
            font-weight: normal;
            opacity: 0.75;
            color: var(--text);
            line-height: 1.4;
        }

        /* 📍 版權資訊樣式 */
        .footer-info {
            text-align: center;
            margin-top: 40px;
            padding-bottom: 20px;
            font-size: 0.75em;
            color: #888;
            line-height: 1.6;
        }
        .footer-info .about-link {
            color: var(--pink);
            text-decoration: underline;
            cursor: pointer;
            margin-top: 10px;
            display: inline-block;
        }
    </style>
</head>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxcsFyLgCfp2_aPvnhbx7aPy8hk6tHjk5ZHOlngGPr4UNKp7L04lj4f55fGVWeVl9WW/exec"; 
        let store = null;
        let currentCouponTab = 0; 
        let currentLoanTab = 0; 
        let savedPw = "";      
        
        const qr = new QRCode(document.getElementById("qrcode"), { width: 200, height: 200 });
        const couponQr = new QRCode(document.getElementById("couponQrcode"), { width: 200, height: 200 });

        async function fetchWithQueue(url, payload, loadingTitle = "處理中...") {
            let currentAbortController = new AbortController();
            const signal = currentAbortController.signal;

            let queuePos = Math.floor(Math.random() * 9); 
            let queueInterval, queueTimeout;
            let isPrompting = false;
            let isFinished = false;

            const startStandardUI = () => {
                if (isFinished) return;
                Swal.fire({
                    title: loadingTitle,
                    text: '正在同步資料，請稍候...',
                    allowOutsideClick: false,
                    didOpen: () => {
                        Swal.showLoading();
                    }
                });
            };

            const renderQueueHtml = (pos) => `
                <div style="margin: 15px 0;">
                    <div style="font-size: 35px; margin-bottom: 15px; display: flex; justify-content: center; gap: 8px;">
                        <span style="animation: queue-bounce 0.8s infinite alternate;">🚶</span>
                        <span style="animation: queue-bounce 0.8s infinite alternate 0.3s;">🚶‍♀️</span>
                        <span style="animation: queue-bounce 0.8s infinite alternate 0.6s;">🚶</span>
                    </div>
                    <div style="font-weight: bold; color: var(--primary, #4f46e5); font-size: 1.1em;">
                        系統目前較為繁忙，您已進入排隊序列
                    </div>
                    <div style="margin-top: 5px; font-size: 0.95em;">
                        目前前方還有 <span style="font-size: 1.5em; color: var(--red, #ff5252); margin: 0 5px;">${pos}</span> 人
                    </div>
                </div>
            `;

            const startQueueUI = () => {
                if (isFinished) return;
                Swal.fire({
                    title: '系統排隊中',
                    html: renderQueueHtml(queuePos),
                    allowOutsideClick: false,
                    showConfirmButton: false,
                    didOpen: () => {
                        queueInterval = setInterval(() => {
                            if (queuePos > 1) {
                                queuePos--;
                                const content = Swal.getHtmlContainer();
                                if (content) content.innerHTML = renderQueueHtml(queuePos);
                            }
                        }, Math.floor(Math.random() * 1500) + 1500); 
                    }
                });
            };

            const isQueueMode = queuePos >= 3;

            if (isQueueMode) {
                startQueueUI();
                queueTimeout = setTimeout(() => {
                    if (isFinished) return;
                    isPrompting = true;
                    clearInterval(queueInterval);
                    
                    Swal.fire({
                        title: '⏳ 等候時間較長',
                        text: '系統目前連線量較大，是否繼續等待？',
                        icon: 'warning',
                        showCancelButton: true,
                        confirmButtonColor: 'var(--green, #10b981)',
                        cancelButtonColor: '#94a3b8',
                        confirmButtonText: '✅ 是，繼續等待',
                        cancelButtonText: '❌ 否，退出等待',
                        allowOutsideClick: false
                    }).then((res) => {
                        if (isFinished) {
                            Swal.close();
                            return;
                        }
                        if (res.isConfirmed) {
                            isPrompting = false;
                            startQueueUI(); 
                        } else {
                            Swal.fire({
                                title: '⚠️ 確定離開？',
                                html: '<span style="color:var(--red, #ff5252); font-weight:bold;">若您選擇離開排隊序列，<br>再次進入時等待時間可能會加長。</span><br><br>確定要放棄當前進度並離開嗎？',
                                icon: 'error',
                                showCancelButton: true,
                                confirmButtonColor: '#94a3b8',
                                cancelButtonColor: 'var(--red, #ff5252)',
                                confirmButtonText: '取消，繼續等待',
                                cancelButtonText: '確定離開',
                                allowOutsideClick: false
                            }).then((exitRes) => {
                                if (isFinished) {
                                    Swal.close();
                                    return;
                                }
                                if (exitRes.dismiss === Swal.DismissReason.cancel) {
                                    isFinished = true;
                                    currentAbortController.abort();
                                    Swal.fire({ title: '已取消', text: '您已退出排隊序列。', icon: 'info', timer: 1500, showConfirmButton: false});
                                } else {
                                    isPrompting = false;
                                    startQueueUI();
                                }
                            });
                        }
                    });
                }, 10000); 
            } else {
                startStandardUI();
            }

            try {
                const response = await fetch(url, {
                    method: 'POST',
                    body: JSON.stringify(payload),
                    signal: signal
                });
                const data = await response.json();
                
                isFinished = true;
                if (isQueueMode) {
                    clearInterval(queueInterval);
                    clearTimeout(queueTimeout);
                }
                
                if (!isPrompting) Swal.close(); 
                return data;
            } catch (err) {
                isFinished = true;
                if (isQueueMode) {
                    clearInterval(queueInterval);
                    clearTimeout(queueTimeout);
                }
                if (err.name === 'AbortError') {
                    return { success: false, aborted: true };
                }
                if (!isPrompting) Swal.close();
                throw err;
            }
        }

        function showAlert(title, text, icon = 'info') {
            if (icon === 'error') {
                showCustomerServiceAlert(title, text);
            } else {
                Swal.fire({
                    title: title,
                    text: text,
                    icon: icon,
                    confirmButtonColor: 'var(--pink)',
                    confirmButtonText: '確定'
                });
            }
        }

        function showCustomerServiceAlert(title, text) {
            Swal.fire({
                title: title,
                html: `<div style="text-align: center; margin-bottom: 10px;">${text}</div><div style="font-weight: bold; color: #ff5252; margin-top: 15px; border-top: 1px dashed #ddd; padding-top: 10px;">仍無法解決問題嗎？建議您與客服中心聯絡</div>`,
                icon: 'error',
                showCancelButton: true,
                confirmButtonColor: 'var(--pink)',
                cancelButtonColor: '#7f8c8d',
                confirmButtonText: '聯絡線上客服',
                cancelButtonText: '關閉'
            }).then((result) => {
                if (result.isConfirmed) {
                    openCustomerServiceMenu();
                }
            });
        }

        function openCustomerServiceMenu() {
            Swal.fire({
                title: '選擇聯絡客服方式',
                html: `
                    <div style="text-align: left; font-size: 0.9em; margin-bottom: 15px; padding: 10px; background: rgba(0,0,0,0.05); border-radius: 10px;">
                        請選擇您方便的管道與客服聯絡：<br>
                        LINE 客服：@536waome<br>
                        客服信箱：j1210217@kusjh.kh.edu.tw<br>
                        客服電話：0966-236-830
                    </div>
                `,
                showDenyButton: true,
                showCancelButton: true,
                confirmButtonColor: '#2ecc71',
                denyButtonColor: '#3498db',
                cancelButtonColor: '#f39c12',
                confirmButtonText: 'LINE 客服',
                denyButtonText: '客服信箱',
                cancelButtonText: '客服電話',
                allowOutsideClick: false

        function generateTimelineHtml(logs, fallbackStatus, fallbackNote, fallbackTime) {
            let html = "";
            let deadlineDisplay = '';
            
            if (logs && Array.isArray(logs)) {
                for (let node of logs) {
                    if (node.rawMsg && node.rawMsg.includes('[取件截止日:')) {
                        const match = node.rawMsg.match(/\[取件截止日:(.*?)\]/);
                        if (match) {
                            deadlineDisplay = match[1];
                            break; 
                        }
                    }
                }
            }

            if (logs && Array.isArray(logs) && logs.length > 0) {
                const sorted = [...logs].sort((a, b) => new Date(b.time) - new Date(a.time));
                html = sorted.map((node, nIdx) => {
                    const cleanNote = (node.note || '動態物流程序記錄正常').replace(/\[取件截止日:.*?\]/g, '').trim() || '動態物流程序記錄正常';
                    return `
                    <div class="timeline-node ${nIdx === 0 ? 'latest-node' : ''}">
                        <div class="timeline-node-title">${node.status}</div>
                        <div class="timeline-node-time">⏱️ ${node.time}</div>
                        <div class="timeline-node-desc">${cleanNote}</div>
                    </div>
                `}).join('');
            } else {
                html += `
                    <div class="timeline-node latest-node">
                        <div class="timeline-node-title">${fallbackStatus}</div>
                        <div class="timeline-node-time">⏱️ ${fallbackTime}</div>
                        <div class="timeline-node-desc">${fallbackNote.replace(/\[取件截止日:.*?\]/g, '').trim()}</div>
                    </div>
                `;
            }
            return { html: html, deadline: deadlineDisplay };
        }

        function renderLoans() {

        function renderCoupons() {
            if (!store || !store.coupons) return;
            const todayStr = new Date().toISOString().split('T')[0];

            const filteredCoupons = store.coupons.filter(c => {
                const isUsed = (c.status === '已使用' || c.status === '已核銷' || c.status === 'Macro已使用');
                let isExpired = false;
                if (c.expiry) {
                    const match = c.expiry.match(/\d{4}-\d{2}-\d{2}/);
                    if (match && match[0] < todayStr) {
                        isExpired = true;
                    }
                }

                if (currentCouponTab === 1) {
                    return isUsed;
                } else if (currentCouponTab === 2) {
                    return !isUsed && isExpired;
                } else {
                    return !isUsed && !isExpired;
                }
            });

            const sortC = document.getElementById('sortC').value;
            filteredCoupons.sort((a, b) => {
                const da = new Date(a.expiry.replace(/-/g, '/')).getTime();
                const db = new Date(b.expiry.replace(/-/g, '/')).getTime();
                return sortC === 'asc' ? da - db : db - da;
            });

            document.getElementById('cpList').innerHTML = filteredCoupons.map(c => {
                const isUsed = (c.status === '已使用' || c.status === '已核銷' || c.status === 'Macro已使用');
                let isExpired = false;
                if (c.expiry) {
                    const match = c.expiry.match(/\d{4}-\d{2}-\d{2}/);
                    if (match && match[0] < todayStr) isExpired = true;
                }

                let tagHtml = '<span class="overdue-tag" style="background:var(--pink);">可使用</span>';
                if (isUsed) {
                    tagHtml = '<span class="overdue-tag" style="background:var(--green);">已核銷</span>';

                    : '';

                return `

            if (!confirmStep1.isConfirmed) return;

            const { value: newName } = await Swal.fire({
                title: '修改個人資料',
                input: 'text',
                inputLabel: '請輸入新的姓名',
                inputValue: store.userData.name,
                showCancelButton: true,
                confirmButtonColor: 'var(--pink)',
                cancelButtonText: '取消',
                confirmButtonText: '下一步',
                inputValidator: (value) => {
                    if (!value || !value.trim()) return '姓名不能為空！';
                }
            });

            if (!newName || newName.trim() === store.userData.name) return;
            const finalizedName = newName.trim();

            const confirmStep2 = await Swal.fire({
                title: '最後確認：確定變更名稱？',
                html: `您確定要將會員名稱從「<span style="color:var(--red);">${store.userData.name}</span>」<br>正式修改為「<span style="color:var(--green);">${finalizedName}</span>」嗎？`,
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: 'var(--pink)',
                cancelButtonText: '返回修改',
                confirmButtonText: '確認修改，不回頭'
            });

            if (!confirmStep2.isConfirmed) return;

            try {
                const res = await fetchWithQueue(SCRIPT_URL, {
                    action: 'updateProfile',
                    uid: store.userData.id,
                    pw: savedPw,
                    newName: finalizedName
                }, '資料更新與連線中...');

                if (res.aborted) return;

                if (res.success) {
                    store.userData.name = finalizedName;
                    render(); 
                    
                    await Swal.fire({
                        title: '基本資料變更成功！',
                        text: `您的姓名已成功更新為：${finalizedName}`,
                        icon: 'success',
                        confirmButtonColor: 'var(--pink)',
                        confirmButtonText: '確定'
                    });
                } else {
                    showCustomerServiceAlert("基本資料更新失敗", res.message || "伺服器更新拒絕，請稍後再試");
                }
            } catch (e) {
                showCustomerServiceAlert("錯誤", "網路連線異常，無法完成基本資料變更");
            }
        }

        async function updateUserPassword() {
            if (!store || !store.userData) return;

            const confirmStep1 = await Swal.fire({
                title: '確定要變更登入密碼嗎？',
                text: '密碼變更成功後，系統將強制安全登出，您需要使用新密碼重新登入。',
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: 'var(--red)',
                cancelButtonText: '取消',
                confirmButtonText: '確定前往'
            });

            if (!confirmStep1.isConfirmed) return;

            const { value: formValues } = await Swal.fire({
                title: '變更登入密碼',
                html:
                    '<input id="swal-old-pw" class="swal2-input" type="password" placeholder="請輸入舊密碼">' +
                    '<input id="swal-new-pw" class="swal2-input" type="password" placeholder="請輸入新密碼">' +
                    '<input id="swal-confirm-pw" class="swal2-input" type="password" placeholder="再次確認新密碼">',
                focusConfirm: false,
                showCancelButton: true,
                confirmButtonColor: 'var(--red)',
                cancelButtonText: '取消',
                confirmButtonText: '下一步',
                preConfirm: () => {
                    const oldPw = document.getElementById('swal-old-pw').value.trim();
                    const newPw = document.getElementById('swal-new-pw').value.trim();
                    const confirmPw = document.getElementById('swal-confirm-pw').value.trim();

                    if (!oldPw || !newPw || !confirmPw) {
                        Swal.showValidationMessage('所有密碼欄位皆為必填！');
                        return false;
                    }
                    if (newPw !== confirmPw) {
                        Swal.showValidationMessage('兩次輸入的新密碼不一致！');
                        return false;
                    }
                    return { oldPw: oldPw, newPw: newPw };
                }
            });

            if (!formValues) return;

            const confirmStep2 = await Swal.fire({
                title: '您確定要寫入新密碼嗎？',
                text: '請確保您記住了剛才輸入的新密碼。按下確定後將立即向伺服器提交變更申請！',
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: 'var(--red)',
                cancelButtonText: '返回修改',
                confirmButtonText: '確認提交變更'
            });

            if (!confirmStep2.isConfirmed) return;

            try {
                const res = await fetchWithQueue(SCRIPT_URL, {
                    action: 'updatePassword',
                    uid: store.userData.id,
                    oldPw: formValues.oldPw,
                    newPw: formValues.newPw
                }, '密碼變更與連線中...');
                
                if (res.aborted) return;

                if (res.success) {
                    await Swal.fire({
                        title: '密碼變更成功！',
                        text: '帳戶安全密碼已成功變更，請點擊確認以安全登出並重新登入。',
                        icon: 'success',
                        confirmButtonColor: 'var(--pink)',
                        confirmButtonText: '登出系統'
                    });
                    location.reload(); 
                } else {
                    showCustomerServiceAlert("密碼變更失敗", res.message || "請檢查您的舊密碼是否輸入正確");
                }
            } catch (e) {
                showCustomerServiceAlert("錯誤", "網路連線異常，變更密碼失敗");
            }
        }

        async function triggerLogout() {
            const confirmResult = await Swal.fire({
                title: '確認要登出系統嗎？',
                text: '登出後需要重新輸入您的帳號與密碼才能存取行動會員。',
                icon: 'question',
                showCancelButton: true,
                confirmButtonColor: 'var(--red)',
                cancelButtonText: '取消',
                confirmButtonText: '安全登出'
            });

            if (confirmResult.isConfirmed) {
                await Swal.fire({
                    title: '登出成功',
                    text: '您已安全登出本系統，再見！',
                    icon: 'success',
                    confirmButtonColor: 'var(--pink)',
                    confirmButtonText: '回到登入頁'
                });
                location.reload(); 
            }
        }
    </script>
</body>
</html>
