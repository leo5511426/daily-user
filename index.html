<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>小佑的日常生活行動會員</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        :root { 
            --bg: #ffffff; --text: #000; --pink: #FF8FA3; --accent: #FF8FA3; --card: #f5f5f5; 
            --border: #e0e0e0; --nav: #fafafa; --red: #ff5252; --green: #2ecc71; --fs: 18px; 
        }
        [data-theme='dark'] { 
            --bg: #000; --text: #fff; --pink: #FFD1DC; --accent: #FF8FA3; --card: #121212; 
            --border: #252525; --nav: #080808; 
        }
        
        body { 
            font-family: -apple-system, sans-serif; 
            background: #e2e8f0; 
            color: var(--text); 
            margin: 0; 
            font-weight: 900; 
            transition: 0.3s; 
            overflow-x: hidden; 
            font-size: var(--fs); 
            display: flex;
            justify-content: center;
        }

        .app-container {
            width: 100%;
            max-width: 500px; 
            height: 100vh;
            background: var(--bg);
            position: relative;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
            transition: max-width 0.3s ease;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .app-container.full-desktop {
            max-width: 100% !important;
            box-shadow: none;
        }

        .page { 
            width: 100%; 
            height: 100%;
            padding: 40px 20px 110px; 
            box-sizing: border-box; 
            display: none; 
            overflow-y: auto; 
            -webkit-overflow-scrolling: touch;
        }
        .card { background: var(--card); border-radius: 20px; padding: 20px; margin-bottom: 15px; border: 1px solid var(--border); position: relative; }
        .btn { width: 100%; padding: 18px; border-radius: 15px; background: var(--accent); color: #fff; border: none; font-size: 1.1em; font-weight: 900; cursor: pointer; }
        
        .nav-bar { 
            position: fixed; 
            bottom: 0; 
            left: 50%;
            transform: translateX(-50%);
            width: 100%; 
            max-width: 500px; 
            height: 90px; 
            background: var(--nav); 
            display: flex; 
            border-top: 1px solid var(--border); 
            z-index: 100; 
            padding-bottom: env(safe-area-inset-bottom); 
            box-sizing: border-box; 
            transition: max-width 0.3s ease;
        }

        .app-container.full-desktop ~ .nav-bar,
        .full-desktop .nav-bar {
            max-width: 100% !important;
        }

        .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #555; font-size: 0.85em; cursor: pointer; }
        .nav-item.active { color: var(--pink); }
        .mask { display:none; position:absolute; top:0; left:0; width:100%; height:100%; background:var(--bg); z-index:999; flex-direction:column; justify-content:center; align-items:center; }
        input { width:100%; padding:18px; margin:10px 0; border-radius:12px; border:1px solid var(--border); background:var(--card); color:var(--text); box-sizing: border-box; font-size: 1em; }
        .overdue-tag { position: absolute; top: 10px; right: 10px; background: var(--red); color: #fff; padding: 4px 8px; border-radius: 8px; font-size: 0.75em; }
        .note-box { font-size: 0.8em; color: #888; margin-top: 8px; border-top: 1px dashed #333; padding-top: 5px; font-weight: normal; }

        .coupon-tabs, .loan-tabs { display: flex; background: var(--card); border-radius: 12px; padding: 5px; margin-bottom: 15px; border: 1px solid var(--border); }
        .coupon-tab, .loan-tab { flex: 1; text-align: center; padding: 10px 0; font-size: 0.9em; cursor: pointer; border-radius: 8px; color: #888; transition: 0.2s; }
        .coupon-tab.active, .loan-tab.active { background: var(--pink); color: #fff; }
        
        .pwd-toggle-container { display: flex; align-items: center; margin: 5px 0 15px; font-size: 0.9em; cursor: pointer; user-select: none; }
        .pwd-toggle-container input { width: auto; margin: 0 8px 0 0; transform: scale(1.2); }

        .swal2-popup { font-family: -apple-system, sans-serif; font-weight: 900; border-radius: 20px !important; }
        [data-theme='dark'] .swal2-popup { background-color: #121212 !important; color: #fff !important; }
        [data-theme='dark'] .swal2-title, [data-theme='dark'] .swal2-html-container { color: #fff !important; }

        .sync-indicator {
            position: absolute;
            top: 12px;
            left: 15px;
            display: none;
            align-items: center;
            gap: 6px;
            z-index: 110;
            background: rgba(0, 0, 0, 0.05);
            padding: 4px 8px;
            border-radius: 20px;
            pointer-events: none;
        }
        [data-theme='dark'] .sync-indicator {
            background: rgba(255, 255, 255, 0.1);
        }
        .sync-spinner {
            width: 12px;
            height: 12px;
            border: 2px solid var(--border);
            border-top: 2px solid var(--pink);
            border-radius: 50%;
            animation: sync-spin 0.8s linear infinite;
        }
        .sync-text {
            font-size: 0.65em;
            opacity: 0.7;
            letter-spacing: 0.5px;
        }
        @keyframes sync-spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .settings-section-title {
            font-size: 1.1em;
            margin: 20px 0 10px 5px;
            color: var(--pink);
            display: flex;
            align-items: center;
            gap: 6px;
        }
    </style>
</head>
<body data-theme="light">

    <div class="app-container" id="appContainer">

        <div id="loading" class="mask"><p>資料同步中...</p></div>

        <div id="loginView" style="display:flex; height:100vh; flex-direction:column; justify-content:center; padding:40px; box-sizing: border-box; overflow-y: auto;">
            <h1 style="color:var(--pink); text-align:center;">小佑的日常生活行動會員</h1>
            <input type="text" id="acc" placeholder="帳號 / ID">
            <input type="password" id="pw" placeholder="密碼">
            <label class="pwd-toggle-container">
                <input type="checkbox" id="showPwdCheck" onchange="togglePasswordVisibility()"> 顯示輸入的密碼
            </label>
            <button class="btn" onclick="doLogin()">登入</button>
        </div>

        <div id="appView" style="display:none; height: 100%; width: 100%; position: relative;">
            <div id="syncIndicator" class="sync-indicator">
                <div class="sync-spinner"></div>
                <div class="sync-text">同步中...</div>
            </div>

            <div id="p0" class="page" style="display:block;">
                <h2>你好，<span id="uName" style="color:var(--pink);">...</span></h2>
                <div class="card" style="text-align:center; padding: 40px 20px;">
                    <div style="font-size:0.8em; opacity:0.6;">可用積分餘額</div>
                    <div style="font-size:2.5em; color:var(--pink);">$ <span id="uBal">0</span></div>
                </div>
                <button class="btn" onclick="showQR()">顯示個人識別碼</button>
            </div>

            <div id="p1" class="page"><h2>交易明細</h2><div id="hList"></div></div>
            <div id="p2" class="page"><h2>訂單狀態</h2><div id="oList"></div></div>
            
            <div id="p3" class="page">
                <h2>待還帳單</h2>
                <div class="loan-tabs">
                    <div class="loan-tab active" id="tabLn0" onclick="switchLoanTab(0)">未結清</div>
                    <div class="loan-tab" id="tabLn1" onclick="switchLoanTab(1)">已結清</div>
                    <div class="loan-tab" id="tabLn2" onclick="switchLoanTab(2)">已逾期</div>
                </div>
                <div id="lList"></div>
            </div>
            
            <div id="p4" class="page">
                <h2>我的優惠券</h2>
                <div class="coupon-tabs">
                    <div class="coupon-tab active" id="tabCp0" onclick="switchCouponTab(0)">未使用</div>
                    <div class="coupon-tab" id="tabCp1" onclick="switchCouponTab(1)">已使用</div>
                    <div class="coupon-tab" id="tabCp2" onclick="switchCouponTab(2)">已過期</div>
                </div>
                <div id="cpList"></div>
            </div>
            
            <div id="p5" class="page">
                <h2>更多設定</h2>
                
                <div class="settings-section-title">👤 個人資料管理</div>
                <div class="card" style="display: flex; flex-direction: column; gap: 10px; padding: 15px;">
                    <button class="btn" onclick="updateProfileName()" style="background:#0284c7; font-size: 1em; padding: 14px;">修改基本資料 (變更姓名)</button>
                    <button class="btn" onclick="updateUserPassword()" style="background:#0f172a; font-size: 1em; padding: 14px;">變更登入密碼</button>
                    <button class="btn" onclick="showQR()" style="background:var(--accent); font-size: 1em; padding: 14px;">顯示個人識別碼</button>
                    <button class="btn" onclick="triggerLogout()" style="background:var(--red); font-size: 1em; padding: 14px;">安全登出系統</button>
                </div>

                <div class="settings-section-title">🎨 介面與顯示設定</div>
                <div class="card">
                    <label style="display:block; margin-bottom:10px;">字體大小調整</label>
                    <input type="range" min="14" max="28" value="18" oninput="document.documentElement.style.setProperty('--fs', this.value + 'px')">
                </div>
                <button class="btn" onclick="toggleLayoutMode()" style="background:#4f46e5; margin-bottom:10px;">🖥️ 電腦版 / 📱 手機版 寬度切換</button>
                <button class="btn" onclick="changeTheme()" style="background:#333; margin-bottom:10px;">外觀配色切換</button>
            </div>

            <div class="nav-bar">
                <div class="nav-item active" onclick="openTab(0)">首頁</div>
                <div class="nav-item" onclick="openTab(1)">紀錄</div>
                <div class="nav-item" onclick="openTab(2)">訂單</div>
                <div class="nav-item" onclick="openTab(3)">帳單</div>
                <div class="nav-item" onclick="openTab(4)">優惠券</div>
                <div class="nav-item" onclick="openTab(5)">設定</div>
            </div>
        </div>

        <div id="qrBox" class="mask" onclick="this.style.display='none'">
            <div style="background:#fff; padding:20px; border-radius:20px;"><div id="qrcode"></div></div>
            <p style="margin-top:20px;">點擊任何處關閉</p>
        </div>

        <div id="couponQrBox" class="mask" onclick="this.style.display='none'">
            <div style="background:#fff; padding:20px; border-radius:20px;"><div id="couponQrcode"></div></div>
            <p style="margin-top:20px; font-weight:bold; color:var(--pink);" id="couponQrTitle">優惠券核銷條碼</p>
            <p style="margin-top:5px; font-size:0.8em; opacity:0.7;">請將此畫面出示給管理員掃描核銷</p>
            <p style="margin-top:15px;">點擊任何處關閉</p>
        </div>

    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwBZOdiX0F0V1GCWiULgER1g-ofefnWdnbOGH9i-sW5F6p5y3oTJlgjSd4iX7GtApYe/exec"; 
        let store = null;
        let currentCouponTab = 0; 
        let currentLoanTab = 0; 
        let savedPw = "";      
        
        const qr = new QRCode(document.getElementById("qrcode"), { width: 200, height: 200 });
        const couponQr = new QRCode(document.getElementById("couponQrcode"), { width: 200, height: 200 });

        function showAlert(title, text, icon = 'info') {
            if (icon === 'error') {
                showCustomerServiceAlert(title, text);
            } else {
                Swal.fire({
                    title: title,
                    text: text,
                    icon: icon,
                    confirmButtonColor: 'var(--pink)',
                    confirmButtonText: '確定'
                });
            }
        }

        function showCustomerServiceAlert(title, text) {
            Swal.fire({
                title: title,
                html: `<div style="text-align: center; margin-bottom: 10px;">${text}</div><div style="font-weight: bold; color: #ff5252; margin-top: 15px; border-top: 1px dashed #ddd; padding-top: 10px;">仍無法解決問題嗎？建議您與客服中心聯絡</div>`,
                icon: 'error',
                showCancelButton: true,
                confirmButtonColor: 'var(--pink)',
                cancelButtonColor: '#7f8c8d',
                confirmButtonText: '聯絡線上客服',
                cancelButtonText: '關閉'
            }).then((result) => {
                if (result.isConfirmed) {
                    openCustomerServiceMenu();
                }
            });
        }

        function openCustomerServiceMenu() {
            Swal.fire({
                title: '選擇聯絡客服方式',
                html: `
                    <div style="text-align: left; font-size: 0.9em; margin-bottom: 15px; padding: 10px; background: rgba(0,0,0,0.05); border-radius: 10px;">
                        請選擇您方便的管道與客服聯絡：<br>
                        LINE 客服：@536waome<br>
                        客服信箱：j1210217@kusjh.kh.edu.tw<br>
                        客服電話：0966-236-830
                    </div>
                `,
                showDenyButton: true,
                showCancelButton: true,
                confirmButtonColor: '#2ecc71',
                denyButtonColor: '#3498db',
                cancelButtonColor: '#f39c12',
                confirmButtonText: 'LINE 客服',
                denyButtonText: '客服信箱',
                cancelButtonText: '客服電話',
                allowOutsideClick: false
            }).then((res) => {
                if (res.isConfirmed) {
                    window.open('https://line.me/R/ti/p/@536waome', '_blank');
                } else if (res.isDenied) {
                    const mailtoUrl = 'mailto:j1210217@kusjh.kh.edu.tw?subject=小佑的日常生活行動會員-問題回報';
                    const startTime = Date.now();
                    window.location.href = mailtoUrl;
                    
                    setTimeout(() => {
                        if (Date.now() - startTime < 1500) {
                            Swal.fire({
                                title: '客服信箱資訊',
                                text: 'j1210217@kusjh.kh.edu.tw',
                                confirmButtonText: '複製信箱',
                                confirmButtonColor: 'var(--pink)'
                            }).then(() => {
                                navigator.clipboard.writeText('j1210217@kusjh.kh.edu.tw');
                                Swal.fire({ title: '已複製信箱！', icon: 'success', timer: 1000, showConfirmButton: false });
                            });
                        }
                    }, 500);
                } else if (res.dismiss === Swal.DismissReason.cancel) {
                    Swal.fire({
                        title: '確定撥打付費電話？',
                        html: '<span style="color: red; font-weight: bold;">【若您選擇撥打付費客服專線，語音電話費率將依照您的電信業者方案資費計收（通常為0.3元/秒）】</span>',
                        icon: 'warning',
                        showCancelButton: true,
                        confirmButtonColor: 'var(--pink)',
                        cancelButtonText: '取消',
                        confirmButtonText: '撥打/顯示號碼'
                    }).then((phoneChoice) => {
                        if (phoneChoice.isConfirmed) {
                            const telUrl = 'tel:0966-236-830';
                            const startTime = Date.now();
                            window.location.href = telUrl;
                            
                            setTimeout(() => {
                                if (Date.now() - startTime < 1500) {
                                    Swal.fire({
                                        title: '客服電話資訊',
                                        text: '0966-236-830',
                                        confirmButtonText: '複製電話',
                                        confirmButtonColor: 'var(--pink)'
                                    }).then(() => {
                                        navigator.clipboard.writeText('0966-236-830');
                                        Swal.fire({ title: '已複製電話！', icon: 'success', timer: 1000, showConfirmButton: false });
                                    });
                                }
                            }, 500);
                        }
                    });
                }
            });
        }

        function togglePasswordVisibility() {
            const pwdInput = document.getElementById('pw');
            const checkBox = document.getElementById('showPwdCheck');
            pwdInput.type = checkBox.checked ? 'text' : 'password';
        }

        async function doLogin() {
            const uid = document.getElementById('acc').value.trim();
            const upw = document.getElementById('pw').value.trim();
            if(!uid || !upw) return showAlert("提示", "請輸入完整資料", "warning");

            Swal.fire({
                title: '登入中',
                text: '驗證身份中，請稍候...',
                allowOutsideClick: false,
                didOpen: () => {
                    Swal.showLoading();
                }
            });

            try {
                const res = await fetch(SCRIPT_URL, { 
                    method: 'POST', 
                    body: JSON.stringify({ action: 'login', uid: uid, pw: upw }) 
                }).then(r => r.json());

                if (res.success) {
                    savedPw = upw; 
                    store = res;
                    render();
                    document.getElementById('loginView').style.display='none';
                    document.getElementById('appView').style.display='block';
                    Swal.close(); 
                } else { 
                    showCustomerServiceAlert("登入失敗", res.message); 
                }
            } catch(e) { 
                showCustomerServiceAlert("很抱歉", "伺服器維護中，請稍後再試"); 
            }
        }

        async function silentSyncData() {
            if (!store || !store.userData || !store.userData.id || !savedPw) return;
            
            const uid = store.userData.id;
            const indicator = document.getElementById('syncIndicator');
            
            if (indicator) indicator.style.display = 'flex';

            try {
                const res = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: 'login', uid: uid, pw: savedPw }) 
                }).then(r => r.json());

                if (res.success) {
                    store = res;
                    render(); 
                }
            } catch (e) {
                console.log("背景資料同步失敗，保持現有數據呈現");
            } finally {
                if (indicator) indicator.style.display = 'none';
            }
        }

        function render() {
            const u = store.userData;
            document.getElementById('uName').innerText = u.name;
            document.getElementById('uBal').innerText = u.bal.toLocaleString();
            
            document.getElementById('hList').innerHTML = store.history.map(h => `
                <div class="card">
                    <div style="display:flex; justify-content:space-between;">
                        <b>${h.item}</b>
                        <span style="color:${h.amt>=0?'var(--green)':'var(--red)'}">${h.amt>=0?'+':''}${h.amt}</span>
                    </div>
                    <div style="display:flex; justify-content:space-between; margin-top:5px;">
                        <small style="opacity:0.5;">${h.time}</small>
                        <small style="opacity:0.6; font-weight:bold;">餘額: ${h.bal}</small>
                    </div>
                    ${h.note ? `<div class="note-box">備註：${h.note}</div>` : ''}
                </div>
            `).join('') || '<p style="text-align:center; opacity:0.3;">無紀錄</p>';

            renderLoans();
            renderCoupons();

            document.getElementById('oList').innerHTML = store.orders.map(o => `
                <div class="card">
                    <div style="color:var(--pink); font-size:0.8em;">單號: ${o.id}</div>
                    <div style="margin:5px 0;"><b>狀態: ${o.status}</b></div>
                    <div style="font-size:0.9em; opacity:0.8;">${o.desc}</div>
                    <div style="font-size:0.7em; margin-top:8px; border-top:1px solid #222; padding-top:5px; opacity:0.5;">
                        ${o.ship} | 單號: ${o.track || '無'}
                    </div>
                </div>
            `).join('') || '<p style="text-align:center; opacity:0.3;">無訂單紀錄</p>';
        }

        function renderLoans() {
            if (!store || !store.loans) return;

            const filteredLoans = store.loans.filter(l => {
                const isCleared = (l.status === '已結清');
                const isOverdue = (!isCleared && l.penalty > 0);

                if (currentLoanTab === 1) {
                    return isCleared;      
                } else if (currentLoanTab === 2) {
                    return isOverdue;      
                } else {
                    return !isCleared && !isOverdue; 
                }
            });

            document.getElementById('lList').innerHTML = filteredLoans.map(l => `
                <div class="card">
                    ${l.status === 'processed_cleared' || l.status === '已結清' ? '<span class="overdue-tag" style="background:var(--green);">已結清</span>' : (l.penalty > 0 ? `<span class="overdue-tag">逾期罰金 $${l.penalty}</span>` : '')}
                    <div style="font-size:1.1em; margin-bottom:5px;">${l.item}</div>
                    <div style="display:flex; justify-content:space-between;">
                        <small style="opacity:0.6;">期限: ${l.expiry}</small>
                        <b style="color:${l.status === 'processed_cleared' || l.status === '橫結清' || l.status === '已結清' ? 'var(--green)' : 'var(--red)'}; font-size:1.2em;">
                            ${l.status === 'processed_cleared' || l.status === '橫結清' || l.status === '已結清' ? 'App結清' : '$' + l.totalDue}
                        </b>
                    </div>
                </div>
            `).join('') || '<p style="text-align:center; opacity:0.3;">此分類下目前無帳單</p>';
        }

        function switchLoanTab(tabIndex) {
            currentLoanTab = tabIndex;
            document.querySelectorAll('.loan-tab').forEach((el, idx) => {
                if (idx === tabIndex) el.classList.add('active');
                else el.classList.remove('active');
            });
            renderLoans();
            silentSyncData(); 
        }

        function renderCoupons() {
            if (!store || !store.coupons) return;
            const todayStr = new Date().toISOString().split('T')[0];

            const filteredCoupons = store.coupons.filter(c => {
                const isUsed = (c.status === '已核銷');
                let isExpired = false;
                if (c.expiry) {
                    const match = c.expiry.match(/\d{4}-\d{2}-\d{2}/);
                    if (match && match[0] < todayStr) {
                        isExpired = true;
                    }
                }

                if (currentCouponTab === 1) {
                    return isUsed;
                } else if (currentCouponTab === 2) {
                    return !isUsed && isExpired;
                } else {
                    return !isUsed && !isExpired;
                }
            });

            document.getElementById('cpList').innerHTML = filteredCoupons.map(c => {
                const isUsed = (c.status === '已核銷');
                let isExpired = false;
                if (c.expiry) {
                    const match = c.expiry.match(/\d{4}-\d{2}-\d{2}/);
                    if (match && match[0] < todayStr) isExpired = true;
                }

                let tagHtml = '<span class="overdue-tag" style="background:var(--pink);">可使用</span>';
                if (isUsed) {
                    tagHtml = '<span class="overdue-tag" style="background:var(--green);">已核銷</span>';
                } else if (isExpired) {
                    tagHtml = '<span class="overdue-tag" style="background:#7f8c8d;">已過期</span>';
                }

                const scanBtnHtml = (!isUsed && !isExpired) 
                    ? `<button class="btn" style="padding:8px 12px; font-size:0.75em; border-radius:8px; margin-top:10px; background:#4f46e5; width:auto; display:block; margin-left:auto;" onclick="showCouponQR('${c.id}', '${c.name}')">出示核銷條碼</button>` 
                    : '';

                return `
                    <div class="card" style="opacity: ${isUsed || isExpired ? '0.6' : '1'};">
                        ${tagHtml}
                        <div style="font-size:1.1em; margin-bottom:5px; padding-right:60px;"><b>${c.name}</b></div>
                        <div style="font-size:0.9em; opacity:0.8; margin-bottom:10px; white-space: pre-line;">${c.content}</div>
                        <div style="display:flex; justify-content:space-between; font-size:0.75em; opacity:0.5; border-top:1px dashed var(--border); padding-top:8px; align-items: center;">
                            <span>到期日: ${c.expiry}</span>
                            ${c.useTime ? `<span>核銷時間: ${c.useTime}</span>` : `<span>券ID: ${c.id}</span>`}
                        </div>
                        ${scanBtnHtml}
                    </div>
                `;
            }).join('') || '<p style="text-align:center; opacity:0.3;">此分類下目前無優惠券</p>';
        }

        function switchCouponTab(tabIndex) {
            currentCouponTab = tabIndex;
            document.querySelectorAll('.coupon-tab').forEach((el, idx) => {
                if (idx === tabIndex) el.classList.add('active');
                else el.classList.remove('active');
            });
            renderCoupons();
            silentSyncData(); 
        }

        function showCouponQR(couponId, couponName) {
            couponQr.clear();
            couponQr.makeCode(couponId);
            document.getElementById('couponQrTitle').innerText = `【${couponName}】核銷條碼`;
            document.getElementById('couponQrBox').style.display = 'flex';
            event.stopPropagation();
        }

        function openTab(i) {
            document.querySelectorAll('.page').forEach(p => p.style.display='none');
            document.getElementById('p'+i).style.display='block';
            document.querySelectorAll('.nav-item').forEach((n,idx) => idx===i?n.classList.add('active'):n.classList.remove('active'));
            silentSyncData(); 
        }

        function showQR() {
            qr.clear();
            qr.makeCode(store.userData.id);
            document.getElementById('qrBox').style.display='flex';
        }

        function changeTheme() {
            const b = document.body;
            b.setAttribute('data-theme', b.getAttribute('data-theme')==='dark' ? 'light' : 'dark');
        }

        function toggleLayoutMode() {
            const container = document.getElementById('appContainer');
            container.classList.toggle('full-desktop');
        }

        /* ==================== 以下為【修正後】具備嚴格兩次前置確認的控制區 ==================== */

        // 修改基本資料 (變更姓名) -> 嚴格包含：1. 進入確認、2. 輸入後二度確認、3. 執行後提示
        async function updateProfileName() {
            if (!store || !store.userData) return;

            // 【第一層前置確認】：詢問是否要修改
            const confirmStep1 = await Swal.fire({
                title: '確定要修改基本資料嗎？',
                text: '您即將變更您的會員個人資料。',
                icon: 'question',
                showCancelButton: true,
                confirmButtonColor: 'var(--pink)',
                cancelButtonText: '取消',
                confirmButtonText: '確定前往'
            });

            if (!confirmStep1.isConfirmed) return;

            // 彈出輸入框供使用者填寫
            const { value: newName } = await Swal.fire({
                title: '修改個人資料',
                input: 'text',
                inputLabel: '請輸入新的姓名',
                inputValue: store.userData.name,
                showCancelButton: true,
                confirmButtonColor: 'var(--pink)',
                cancelButtonText: '取消',
                confirmButtonText: '下一步',
                inputValidator: (value) => {
                    if (!value || !value.trim()) return '姓名不能為空！';
                }
            });

            if (!newName || newName.trim() === store.userData.name) return;
            const finalizedName = newName.trim();

            // 【第二層前置確認】：輸入完成後的最終確認
            const confirmStep2 = await Swal.fire({
                title: '最後確認：確定變更名稱？',
                html: `您確定要將會員名稱從「<span style="color:var(--red);">${store.userData.name}</span>」<br>正式修改為「<span style="color:var(--green);">${finalizedName}</span>」嗎？`,
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: 'var(--pink)',
                cancelButtonText: '返回修改',
                confirmButtonText: '確認修改，不回頭'
            });

            if (!confirmStep2.isConfirmed) return;

            // 兩次確認皆通過，開始執行連線
            Swal.fire({
                title: '資料更新中',
                text: '請稍候...',
                allowOutsideClick: false,
                didOpen: () => Swal.showLoading()
            });

            try {
                const res = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify({
                        action: 'updateProfile',
                        uid: store.userData.id,
                        pw: savedPw,
                        newName: finalizedName
                    })
                }).then(r => r.json());

                if (res.success) {
                    store.userData.name = finalizedName;
                    render(); 
                    
                    // 【修改後結果提示（成功）】
                    await Swal.fire({
                        title: '基本資料變更成功！',
                        text: `您的姓名已成功更新為：${finalizedName}`,
                        icon: 'success',
                        confirmButtonColor: 'var(--pink)',
                        confirmButtonText: '確定'
                    });
                } else {
                    // 【修改後結果提示（失敗）】
                    showCustomerServiceAlert("基本資料更新失敗", res.message || "伺服器更新拒絕，請稍後再試");
                }
            } catch (e) {
                // 【修改後結果提示（異常）】
                showCustomerServiceAlert("錯誤", "網路連線異常，無法完成基本資料變更");
            }
        }

        // 變更登入密碼 -> 嚴格包含：1. 進入確認、2. 輸入完成後二度確認、3. 執行後提示
        async function updateUserPassword() {
            if (!store || !store.userData) return;

            // 【第一層前置確認】：詢問是否變更密碼
            const confirmStep1 = await Swal.fire({
                title: '確定要變更登入密碼嗎？',
                text: '密碼變更成功後，系統將強制安全登出，您需要使用新密碼重新登入。',
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: 'var(--red)',
                cancelButtonText: '取消',
                confirmButtonText: '確定前往'
            });

            if (!confirmStep1.isConfirmed) return;

            // 彈出表單讓使用者填寫
            const { value: formValues } = await Swal.fire({
                title: '變更登入密碼',
                html:
                    '<input id="swal-old-pw" class="swal2-input" type="password" placeholder="請輸入舊密碼">' +
                    '<input id="swal-new-pw" class="swal2-input" type="password" placeholder="請輸入新密碼">' +
                    '<input id="swal-confirm-pw" class="swal2-input" type="password" placeholder="再次確認新密碼">',
                focusConfirm: false,
                showCancelButton: true,
                confirmButtonColor: 'var(--red)',
                cancelButtonText: '取消',
                confirmButtonText: '下一步',
                preConfirm: () => {
                    const oldPw = document.getElementById('swal-old-pw').value.trim();
                    const newPw = document.getElementById('swal-new-pw').value.trim();
                    const confirmPw = document.getElementById('swal-confirm-pw').value.trim();

                    if (!oldPw || !newPw || !confirmPw) {
                        Swal.showValidationMessage('所有密碼欄位皆為必填！');
                        return false;
                    }
                    if (newPw !== confirmPw) {
                        Swal.showValidationMessage('兩次輸入的新密碼不一致！');
                        return false;
                    }
                    return { oldPw: oldPw, newPw: newPw };
                }
            });

            if (!formValues) return;

            // 【第二層前置確認】：輸入完畢後的最終確認
            const confirmStep2 = await Swal.fire({
                title: '您確定要寫入新密碼嗎？',
                text: '請確保您記住了剛才輸入的新密碼。按下確定後將立即向伺服器提交變更申請！',
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: 'var(--red)',
                cancelButtonText: '返回修改',
                confirmButtonText: '確認提交變更'
            });

            if (!confirmStep2.isConfirmed) return;

            // 兩次前置確認皆通過，開始執行網路發送
            Swal.fire({
                title: '密碼變更中',
                text: '請稍候...',
                allowOutsideClick: false,
                didOpen: () => Swal.showLoading()
            });

            try {
                const res = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify({
                        action: 'updatePassword',
                        uid: store.userData.id,
                        oldPw: formValues.oldPw,
                        newPw: formValues.newPw
                    })
                }).then(r => r.json());

                if (res.success) {
                    // 【修改後結果提示（成功）】
                    await Swal.fire({
                        title: '密碼變更成功！',
                        text: '帳戶安全密碼已成功變更，請點擊確認以安全登出並重新登入。',
                        icon: 'success',
                        confirmButtonColor: 'var(--pink)',
                        confirmButtonText: '登出系統'
                    });
                    location.reload(); 
                } else {
                    // 【修改後結果提示（失敗）】
                    showCustomerServiceAlert("密碼變更失敗", res.message || "請檢查您的舊密碼是否輸入正確");
                }
            } catch (e) {
                // 【修改後結果提示（異常）】
                showCustomerServiceAlert("錯誤", "網路連線異常，變更密碼失敗");
            }
        }

        // 安全登出系統 -> 包含登出前、登出後確認
        async function triggerLogout() {
            const confirmResult = await Swal.fire({
                title: '確認要登出系統嗎？',
                text: '登出後需要重新輸入您的帳號與密碼才能存取行動會員。',
                icon: 'question',
                showCancelButton: true,
                confirmButtonColor: 'var(--red)',
                cancelButtonText: '取消',
                confirmButtonText: '安全登出'
            });

            if (confirmResult.isConfirmed) {
                await Swal.fire({
                    title: '登出成功',
                    text: '您已安全登出本系統，再見！',
                    icon: 'success',
                    confirmButtonColor: 'var(--pink)',
                    confirmButtonText: '回到登入頁'
                });
                location.reload(); 
            }
        }
    </script>
</body>
</html>
